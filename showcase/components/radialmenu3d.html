<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadialMenu3D Component - Spatial UI 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">
    <link rel="stylesheet" href="../styles/mobile-panel.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../../index.html" class="navbar-logo">🌸 Spatial UI 3D</a>
            <ul class="navbar-menu">
                <li><a href="../../index.html#features" class="navbar-link">Features</a></li>
                <li><a href="../index.html" class="navbar-link">Components</a></li>
                <li><a href="../../demos/index.html" class="navbar-link">Demos</a></li>
            </ul>
        </div>
    </nav>

    <div class="component-showcase">
        <!-- Sidebar Controls -->
        <aside class="sidebar demo-controls">
            <div class="sidebar-header">
                <h2>RadialMenu3D</h2>
                <p>Circular Selection Carousel</p>
            </div>

            <div class="control-group">
                <label class="control-label">Menu Radius</label>
                <div class="slider-container">
                    <input type="range" id="radius-slider" min="1" max="5" step="0.1" value="2.5">
                    <span class="value-display" id="radius-value">2.5</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Hole Size (Ratio)</label>
                <div class="slider-container">
                    <input type="range" id="scale-slider" min="0.1" max="0.8" step="0.1" value="0.4">
                    <span class="value-display" id="scale-value">0.4</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Z-Pop Depth</label>
                <div class="slider-container">
                    <input type="range" id="z-slider" min="0" max="2" step="0.1" value="0.5">
                    <span class="value-display" id="z-value">0.5</span>
                </div>
            </div>

            <div class="control-group">
                <h3>Selection</h3>
                <div id="selection-log"
                    style="padding:1rem; background:rgba(255,255,255,0.1); border-radius:4px; font-family:monospace; border: 1px solid transparent; transition: all 0.2s;">
                    None
                </div>
            </div>

            <button id="reset-btn" class="btn btn-secondary" style="width:100%; margin-top:20px;">Reset View</button>
        </aside>

        <!-- Main Canvas Area -->
        <main class="preview-area">
            <canvas id="showcase-canvas"></canvas>
            <div class="instruction-overlay">
                Hover to Pop | Click to Select | Drag to Rotate View
            </div>
        </main>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { RadialMenu3D } from '../../src/controls/RadialMenu3D.js';
        import { ControlRegistry } from '../../src/core/ControlRegistry.js';
        import * as THREE from 'three';

        // Setup Scene
        const canvas = document.getElementById('showcase-canvas');
        const scene3D = new Scene3D(canvas);
        const scene = scene3D.getScene();
        const camera = scene3D.getCamera();
        const renderer = scene3D.getRenderer();
        const controls = scene3D.getControls();

        ControlRegistry.setOrbitControls(controls);

        // Styling
        scene.background = new THREE.Color(0x111111);
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        grid.position.y = -2;
        scene.add(grid);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(0, 0, 8);

        // Define items
        const weapons = [
            { label: 'Pistol', color: 0x999999 },
            { label: 'Shotgun', color: 0xaa0000 },
            { label: 'Rifle', color: 0x008800 },
            { label: 'Sniper', color: 0x0000aa },
            { label: 'Rocket', color: 0xff8800 },
            { label: 'Laser', color: 0x00ffff },
            { label: 'Plasma', color: 0xaa00ff },
            { label: 'Melee', color: 0xffff00 }
        ];

        // Create Menu
        let menu;

        function createMenu() {
            if (menu) {
                scene.remove(menu.group);
                // Basic manual cleanup since we're replacing the whole object
                // The new RadialMenu3D logic manages its own geometry disposal on construction if needed
            }

            // Get UI values
            const radius = parseFloat(document.getElementById('radius-slider').value);
            const holeRatio = parseFloat(document.getElementById('scale-slider').value);
            const hoverPop = parseFloat(document.getElementById('z-slider').value);

            menu = new RadialMenu3D(scene, camera, [0, 0, 0], {
                radius: radius,
                innerRadius: radius * holeRatio, // Calculate inner radius based on ratio
                gap: 0.05,
                hoverZPop: hoverPop,
                sectorColor: 0x222222,
                items: weapons.map(w => ({
                    label: w.label,
                    color: w.color,
                    action: () => {
                        const log = document.getElementById('selection-log');
                        log.textContent = `Selected: ${w.label}`;
                        log.style.color = '#' + w.color.toString(16).padStart(6, '0');
                        log.style.borderColor = '#' + w.color.toString(16).padStart(6, '0');
                    }
                })),
                renderer: renderer
            });
        }

        createMenu();

        // UI Listeners
        document.getElementById('radius-slider').addEventListener('input', (e) => {
            document.getElementById('radius-value').textContent = e.target.value;
            createMenu();
        });

        document.getElementById('scale-slider').addEventListener('input', (e) => {
            document.getElementById('scale-value').textContent = e.target.value;
            createMenu();
        });

        document.getElementById('z-slider').addEventListener('input', (e) => {
            document.getElementById('z-value').textContent = e.target.value;
            // Can update live if property exposed, but recreating is safer for prototype
            createMenu();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            camera.position.set(0, 0, 8);
            controls.reset();
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            if (menu && menu.update) menu.update();
            scene3D.render();
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <script type="module" src="../scripts/mobile-controls.js"></script>
</body>

</html>
