<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataVolume3D - Spatial UI 3D</title>
    <link rel="stylesheet" href="../styles/showcase.css">
    <link rel="stylesheet" href="../styles/mobile-panel.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 100, 255, 0.3);
            backdrop-filter: blur(10px);
            width: 250px;
            pointer-events: auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #aaaaff;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #5555ff;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <h1 style="color: #ccccff; font-family: 'Outfit', sans-serif; text-shadow: 0 0 10px #5555ff; margin: 0;">
            DataVolume3D</h1>
        <p style="color: #8888cc; font-family: 'Inter', sans-serif; margin-top: 5px;">Volumetric Density Visualization
        </p>
    </div>

    <div class="controls-panel demo-controls">
        <div class="control-group">
            <label>Density Threshold</label>
            <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.2">
        </div>
        <div class="control-group">
            <label>Slice X</label>
            <input type="range" id="slice-x" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="control-group">
            <label>Slice Y</label>
            <input type="range" id="slice-y" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="control-group">
            <label>Slice Z</label>
            <input type="range" id="slice-z" min="0" max="1" step="0.01" value="1">
        </div>
        <div id="stats" style="color: #666; font-size: 0.8rem; font-family: monospace;">Voxels: 32768</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DataVolume3D } from '../../src/controls/DataVolume3D.js';

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting (not strictly needed for BasicMaterial but good for orbit controls target)
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // Data Volume
        const volume = new DataVolume3D(scene, camera, [0, 0, 0], {
            resolution: 32,
            dimensions: new THREE.Vector3(10, 10, 10),
            threshold: 0.2,
            pointSize: 5.0, // Make points initially large enough to overlap slightly
            colorLow: 0x0044ff,
            colorHigh: 0xff4444
        });

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // UI Logic
        document.getElementById('threshold-slider').addEventListener('input', (e) => {
            volume.setThreshold(parseFloat(e.target.value));
        });

        ['x', 'y', 'z'].forEach(axis => {
            document.getElementById(`slice-${axis}`).addEventListener('input', (e) => {
                volume.setSlice(axis, parseFloat(e.target.value));
            });
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <script type="module" src="../scripts/mobile-controls.js"></script>
</body>

</html>
