<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloMap3D - Spatial UI 3D</title>
    <link rel="stylesheet" href="../styles/showcase.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 40, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #00ffff;
            margin-bottom: 5px;
            font-family: 'Inter', sans-serif;
        }

        button {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 10px #00ffff;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <h1 style="color: #00ffff; font-family: 'Outfit', sans-serif; text-shadow: 0 0 10px #00ffff;">HoloMap3D</h1>
        <p style="color: #88ccff; font-family: 'Inte', sans-serif;">Holographic Data Visualization</p>
    </div>

    <div class="controls-panel demo-controls">
        <div class="control-group">
            <label>Controls</label>
            <button id="btn-toggle-spin">Toggle Rotation</button>
            <button id="btn-add-marker">Add Random Marker</button>
        </div>
        <div class="control-group">
            <label>Stats</label>
            <div id="stats-display" style="color: #fff; font-family: monospace;">Markers: 0</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { HoloMap3D } from '../../src/controls/HoloMap3D.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        // Grid helper for reference
        const gridHelper = new THREE.GridHelper(40, 40, 0x112233, 0x051020);
        scene.add(gridHelper);

        // Create HoloMap
        const holoMap = new HoloMap3D(scene, camera, [0, 0, 0], {
            radius: 4,
            gridColor: 0x00ffff,
            glowColor: 0x0088ff,
            markers: [
                { lat: 40.7128, lon: -74.0060, label: "New York" },
                { lat: 51.5074, lon: -0.1278, label: "London" },
                { lat: 35.6762, lon: 139.6503, label: "Tokyo" }
            ]
        });

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // UI Logic
        let markerCount = 3;
        const statsDisplay = document.getElementById('stats-display');
        statsDisplay.textContent = `Markers: ${markerCount}`;

        document.getElementById('btn-toggle-spin').addEventListener('click', () => {
            holoMap.autoRotate = !holoMap.autoRotate;
        });

        document.getElementById('btn-add-marker').addEventListener('click', () => {
            const lat = (Math.random() * 180) - 90;
            const lon = (Math.random() * 360) - 180;
            holoMap.addMarker(lat, lon);
            markerCount++;
            statsDisplay.textContent = `Markers: ${markerCount}`;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime() * 1000;
            const delta = clock.getDelta();

            holoMap.update(time);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <script type="module" src="../../scripts/mobile-controls.js"></script>
</body>

</html>
