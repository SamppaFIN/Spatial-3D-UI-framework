<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetworkGraph3D - Spatial UI 3D</title>
    <link rel="stylesheet" href="../styles/showcase.css">
    <link rel="stylesheet" href="../styles/mobile-panel.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000510;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 40, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 100, 255, 0.2);
            backdrop-filter: blur(10px);
            width: 250px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #44aaff;
            margin-bottom: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #44aaff;
        }

        button {
            width: 100%;
            background: rgba(0, 100, 255, 0.1);
            border: 1px solid #44aaff;
            color: #44aaff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: rgba(0, 100, 255, 0.3);
            box-shadow: 0 0 10px #0055aa;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <h1 style="color: #44aaff; font-family: 'Outfit', sans-serif; text-shadow: 0 0 10px #0055aa;">NetworkGraph3D
        </h1>
        <p style="color: #88ccff; font-family: 'Inter', sans-serif;">Force-Directed Physics Layout</p>
    </div>

    <div class="controls-panel demo-controls">
        <div class="control-group">
            <label>Repulsion Strength</label>
            <input type="range" id="repulsion-slider" min="10" max="500" value="100">
        </div>
        <div class="control-group">
            <label>Link Distance</label>
            <input type="range" id="distance-slider" min="10" max="100" value="30">
        </div>
        <div class="control-group">
            <button id="btn-explode">💥 Explode Physics</button>
            <button id="btn-toggle">Pause Physics</button>
        </div>
        <div class="control-group">
            <label>Stats</label>
            <div id="stats" style="color: #fff; font-size: 0.8em; font-family: monospace;">Nodes: 100 | Links: 150</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { NetworkGraph3D } from '../../src/controls/NetworkGraph3D.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000510, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x44aaff, 2, 100);
        pointLight.position.set(0, 20, 20);
        scene.add(pointLight);

        // Generate Random Graph Data
        const nodeCount = 100;
        const linkCount = 150;
        const nodes = [];
        const links = [];

        for (let i = 0; i < nodeCount; i++) {
            nodes.push({
                id: i,
                val: 0.5 + Math.random() * 1.5, // Size multiplier
                group: Math.floor(Math.random() * 5)
            });
        }

        for (let i = 0; i < linkCount; i++) {
            const source = Math.floor(Math.random() * nodeCount);
            let target = Math.floor(Math.random() * nodeCount);
            if (target === source) target = (source + 1) % nodeCount;

            links.push({ source, target });
        }

        // Initialize NetworkGraph
        const network = new NetworkGraph3D(scene, camera, [0, 0, 0], {
            nodes: nodes,
            links: links,
            nodeColor: 0x00aaff,
            linkColor: 0x004488,
            repulsion: 100,
            linkDistance: 30
        });

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // UI Listeners
        document.getElementById('repulsion-slider').addEventListener('input', (e) => {
            network.repulsion = parseFloat(e.target.value);
        });

        document.getElementById('distance-slider').addEventListener('input', (e) => {
            network.linkDistance = parseFloat(e.target.value);
        });

        document.getElementById('btn-explode').addEventListener('click', () => {
            // Apply strong random force
            network.nodeVelocities.forEach(v => {
                v.x += (Math.random() - 0.5) * 100;
                v.y += (Math.random() - 0.5) * 100;
                v.z += (Math.random() - 0.5) * 100;
            });
        });

        const toggleBtn = document.getElementById('btn-toggle');
        toggleBtn.addEventListener('click', () => {
            network.enablePhysics = !network.enablePhysics;
            toggleBtn.textContent = network.enablePhysics ? "Pause Physics" : "Resume Physics";
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta(); // Cap delta if needed

            network.update(time, Math.min(delta, 0.05));
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <script type="module" src="../scripts/mobile-controls.js"></script>
</body>

</html>
