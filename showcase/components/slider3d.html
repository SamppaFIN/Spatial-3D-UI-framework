<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider3D | Spatial UI Showcase</title>
    <link rel="stylesheet" href="../css/showcase.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosmic-bg: #0a0a12;
            --cosmic-card: #141425;
            --cosmic-cyan: #00d4ff;
            --cosmic-magenta: #ff00ff;
            --cosmic-text: #e0e0e0;
        }

        .showcase-page {
            background-color: var(--cosmic-bg);
            color: var(--cosmic-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .showcase-nav {
            display: flex;
            align-items: center;
            padding: 1rem 2.5rem;
            background: rgba(20, 20, 37, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            color: var(--cosmic-cyan);
            text-decoration: none;
            font-weight: 600;
            margin-right: 2.5rem;
            transition: transform 0.2s;
        }

        .nav-back:hover {
            transform: translateX(-5px);
        }

        .nav-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fff, var(--cosmic-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .demo-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .demo-card {
            background: var(--cosmic-card);
            border-radius: 24px;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s;
        }

        .demo-grid {
            display: grid;
            gap: 2.5rem;
        }

        .canvas-wrapper {
            border-radius: 16px;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b1b2f 0%, #0a0a12 100%);
            position: relative;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            max-height: 650px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--cosmic-cyan) rgba(255, 255, 255, 0.1);
        }

        .control-group h3 {
            margin: 0 0 1rem 0;
            color: var(--cosmic-cyan);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .ui-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .ui-row label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        .btn-toggle-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .ui-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
        }

        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .ui-btn.active {
            background: var(--cosmic-cyan);
            color: #000;
            border-color: var(--cosmic-cyan);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .value-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            font-family: 'Inter', sans-serif;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--cosmic-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .badge-discrete {
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.3);
            color: #ff66ff;
            font-weight: 800;
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .color-well {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }
    </style>
</head>

<body class="showcase-page">
    <nav class="showcase-nav">
        <a href="../index.html" class="nav-back">← EXPLORER</a>
        <div class="nav-title">SPATIAL SLIDER 3D</div>
    </nav>

    <main class="demo-container">
        <!-- Main Playground -->
        <section class="demo-card">
            <h2 style="margin: 0 0 0.5rem 0;">Spatial Control Playground</h2>
            <p style="margin: 0 0 2rem 0; opacity: 0.6; font-size: 0.9rem;">Explore presets, kinetic physics, and the
                new styling system.</p>

            <div class="demo-grid">
                <div class="canvas-wrapper" style="height: 650px;">
                    <canvas id="canvas-main"></canvas>
                </div>

                <div class="controls-panel demo-controls">
                    <div class="control-group">
                        <div class="value-display" id="val-main">50.0</div>
                    </div>

                    <div class="control-group">
                        <h3>Visual Presets</h3>
                        <div class="btn-toggle-group" style="grid-template-columns: repeat(3, 1fr);">
                            <button class="ui-btn active" data-preset="glass">GLASS</button>
                            <button class="ui-btn" data-preset="cyber">CYBER</button>
                            <button class="ui-btn" data-preset="industrial">IRON</button>
                        </div>
                        <button class="ui-btn" style="width: 100%;" data-preset="minimal">MINIMALIST</button>
                    </div>

                    <div class="control-group">
                        <h3>Custom Styling</h3>
                        <div class="ui-row">
                            <label>TRACK OPACITY</label>
                            <input type="range" id="prop-trackOpacity" min="0" max="1" step="0.05" value="0.35">
                        </div>
                        <div class="ui-row">
                            <label>GLOW INTENSITY</label>
                            <input type="range" id="prop-glowIntensity" min="0" max="3" step="0.1" value="1.0">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="ui-row">
                                <label>TRACK COLOR</label>
                                <input type="color" id="prop-trackColor" value="#ff0000" class="color-well">
                            </div>
                            <div class="ui-row">
                                <label>HANDLE COLOR</label>
                                <input type="color" id="prop-handleColor" value="#ffffff" class="color-well">
                            </div>
                            <div class="ui-row">
                                <label>FILL COLOR</label>
                                <input type="color" id="prop-fillColor" value="#00d4ff" class="color-well">
                            </div>
                            <div class="ui-row">
                                <label>GLOW COLOR</label>
                                <input type="color" id="prop-glowColor" value="#00d4ff" class="color-well">
                            </div>
                        </div>
                    </div>

                    <div class="control-group">
                        <h3>Geometry & Dimensions</h3>
                        <div class="ui-row">
                            <label>TRACK SHAPE</label>
                            <div class="btn-toggle-group">
                                <button class="ui-btn active" id="ts-pill">PILL</button>
                                <button class="ui-btn" id="ts-box">BOX</button>
                            </div>
                        </div>
                        <div class="ui-row">
                            <label>HANDLE SHAPE</label>
                            <div class="btn-toggle-group">
                                <button class="ui-btn active" id="hs-sphere">SPHERE</button>
                                <button class="ui-btn" id="hs-box">BOX</button>
                            </div>
                        </div>
                        <div class="ui-row">
                            <label>WIDTH</label>
                            <input type="range" id="prop-width" min="2" max="8" step="0.1" value="5.0">
                        </div>
                        <div class="ui-row">
                            <label>HEIGHT</label>
                            <input type="range" id="prop-height" min="0.1" max="1.0" step="0.05" value="0.35">
                        </div>
                    </div>

                    <div class="control-group">
                        <h3>Kinetic Physics</h3>
                        <div class="ui-row">
                            <label>TENSION (SNAPPINESS)</label>
                            <input type="range" id="prop-tension" min="0.05" max="0.5" step="0.01" value="0.15">
                        </div>
                        <div class="ui-row">
                            <label>FRICTION (DRAG)</label>
                            <input type="range" id="prop-friction" min="0.5" max="0.98" step="0.01" value="0.8">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Experience Levels (Discrete) -->
        <section class="demo-card">
            <h2 style="margin: 0 0 0.5rem 0;">Experience Levels</h2>
            <div class="demo-grid">
                <div class="canvas-wrapper"
                    style="height: 400px; background: radial-gradient(circle at center, #251225 0%, #0a0a12 100%);">
                    <canvas id="canvas-experience"></canvas>
                </div>
                <div class="controls-panel" style="justify-content: center;">
                    <div id="badge-experience" class="badge-discrete">STANDARD</div>
                    <div style="margin-top: 2rem;" class="ui-row">
                        <label>ACTIVE MODE</label>
                        <input type="range" id="input-experience" min="0" max="4" step="1" value="1">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="../../scripts/mobile-controls.js"></script>
    <script type="module">
        import * as THREE from 'three';
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';

        // --- COMMON ANIMATION LOOP ---
        const activeControls = [];
        function animate() {
            requestAnimationFrame(animate);
            activeControls.forEach(c => {
                c.control.update();
                c.scene.render();
            });
        }
        animate();

        // --- 1. MAIN PLAYGROUND ---
        const mainCanvas = document.getElementById('canvas-main');
        const mainScene = new Scene3D(mainCanvas);
        mainScene.getCamera().position.set(0, 0, 7);

        // Improve Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        mainScene.getScene().add(ambientLight);

        // Access the existing directional light if possible, or add a new one?
        // Scene3D might have default lights. Let's add a strong spotlight for the slider.
        const spotLight = new THREE.SpotLight(0xffffff, 2);
        spotLight.position.set(5, 10, 5);
        spotLight.lookAt(0, 0, 0);
        mainScene.getScene().add(spotLight);

        // RIM LIGHT for separation
        const rimLight = new THREE.SpotLight(0x4444ff, 5);
        rimLight.position.set(0, 2, -5); // Behind and slightly up
        rimLight.lookAt(0, 0, 0);
        mainScene.getScene().add(rimLight);

        const sliderMain = new Slider3D(mainScene.getScene(), mainScene.getCamera(), [0, 0, 0], {
            width: 5.0,
            preset: 'glass',
            trackColor: 0xff0000 // Default to Red as requested
        });

        activeControls.push({ control: sliderMain, scene: mainScene });

        sliderMain.on('change', ({ value }) => {
            if (typeof value === 'number') {
                document.getElementById('val-main').innerText = value.toFixed(1);
            }
        });

        // Main Event Bindings
        document.querySelectorAll('[data-preset]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sliderMain.set('preset', btn.getAttribute('data-preset'));

                // Sync UI inputs with preset
                setTimeout(() => {
                    document.getElementById('prop-trackOpacity').value = sliderMain.get('trackOpacity');
                    document.getElementById('prop-glowIntensity').value = sliderMain.get('glowIntensity');
                }, 50);
            };
        });

        document.getElementById('prop-trackOpacity').oninput = (e) => sliderMain.set('trackOpacity', parseFloat(e.target.value));
        document.getElementById('prop-glowIntensity').oninput = (e) => sliderMain.set('glowIntensity', parseFloat(e.target.value));
        document.getElementById('prop-tension').oninput = (e) => sliderMain.tension = parseFloat(e.target.value);
        document.getElementById('prop-friction').oninput = (e) => sliderMain.friction = parseFloat(e.target.value);

        document.getElementById('prop-trackColor').oninput = (e) => sliderMain.set('trackColor', parseInt(e.target.value.replace('#', '0x')));
        document.getElementById('prop-handleColor').oninput = (e) => sliderMain.set('handleColor', parseInt(e.target.value.replace('#', '0x')));
        document.getElementById('prop-fillColor').oninput = (e) => sliderMain.set('fillColor', parseInt(e.target.value.replace('#', '0x')));
        document.getElementById('prop-glowColor').oninput = (e) => sliderMain.set('glowColor', parseInt(e.target.value.replace('#', '0x')));

        document.getElementById('prop-width').oninput = (e) => sliderMain.set('width', parseFloat(e.target.value));
        document.getElementById('prop-height').oninput = (e) => sliderMain.set('height', parseFloat(e.target.value));

        // Shape Toggles
        const setShapeBtnActive = (type, val) => {
            document.querySelectorAll(`[id^="${type}-"]`).forEach(b => {
                if (b.id === `${type}-${val}`) b.classList.add('active');
                else b.classList.remove('active');
            });
        };

        document.getElementById('ts-pill').onclick = () => { sliderMain.set('trackShape', 'pill'); setShapeBtnActive('ts', 'pill'); };
        document.getElementById('ts-box').onclick = () => { sliderMain.set('trackShape', 'box'); setShapeBtnActive('ts', 'box'); };

        document.getElementById('hs-sphere').onclick = () => { sliderMain.set('handleShape', 'sphere'); setShapeBtnActive('hs', 'sphere'); };
        document.getElementById('hs-box').onclick = () => { sliderMain.set('handleShape', 'box'); setShapeBtnActive('hs', 'box'); };

        // --- 2. EXPERIENCE SLIDER ---
        const expCanvas = document.getElementById('canvas-experience');
        const expScene = new Scene3D(expCanvas);
        expScene.getCamera().position.set(0, 0, 6);
        expScene.setBackgroundColor(0x0c0012);

        const modes = ['MINIMAL', 'STANDARD', 'ADVANCED', 'EXPERT', 'ULTRA'];
        const sliderExp = new Slider3D(expScene.getScene(), expScene.getCamera(), [0, 0, 0], {
            values: modes,
            valueIndex: 1,
            width: 5.5,
            preset: 'cyber',
            tickMarks: true,
            tickInterval: 1
        });

        activeControls.push({ control: sliderExp, scene: expScene });

        sliderExp.on('change', ({ valueIndex }) => {
            const modeName = modes[valueIndex];
            document.getElementById('badge-experience').innerText = modeName;
            document.getElementById('badge-experience').style.color = sliderExp.get('fillColor');
            document.getElementById('input-experience').value = valueIndex;
        });

        document.getElementById('input-experience').oninput = (e) => sliderExp.setValue(parseInt(e.target.value));

    </script>
</body>

</html>
