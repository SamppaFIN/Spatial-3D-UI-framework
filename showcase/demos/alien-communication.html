<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Relay: First Contact</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
            font-family: 'Courier New', monospace;
        }

        #relay-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Void vignette */
        #void {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(5, 5, 20, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="void"></div>
    <div id="relay-hud">
        <h1>ANDROMEDA RELAY ALPHA</h1>
        <div class="sub">Deep Space Sector 8 • Neutral Territory</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { AIPortal3D } from '../../src/controls/AIPortal3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x050510);
        env.scene.fog = new THREE.FogExp2(0x050510, 0.05);

        // Pulsar Lighting
        const amb = new THREE.AmbientLight(0x00ff88, 0.3);
        env.scene.add(amb);

        const beacon = new THREE.PointLight(0xff00ff, 2, 15);
        beacon.position.set(0, 5, -2);
        env.scene.add(beacon);

        // 2. Xenon AI (Ghost)
        const ambassador = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(ambassador);
        env.updatables.push(ambassador);

        setTimeout(() => {
            ambassador.updatePanelText("DECODING_XENO_LINK...");
            ambassador.guideTo(portal1.group, "Established Link: Zeta Reticuli");
        }, 1500);


        // 3. RELAY PORTALS

        const portal1 = new AIPortal3D(env.scene, env.camera, [-3, 1.8, -3], {
            width: 2.2, height: 3.2, label: "ZETA_LINK", theme: 'cosmic'
        });
        env.add(portal1.group);
        env.updatables.push(portal1);

        const info1 = new HaloCard3D(env.scene, env.camera, [0, 0, 0], {
            title: "Zeta Reticulans: Friendly", width: 2, height: 0.4,
            offset: [0, -2, 0], anchorObject: portal1.group, color: 0x00ff88
        });
        env.add(info1.group);
        env.updatables.push(info1);

        const portal2 = new AIPortal3D(env.scene, env.camera, [3, 1.8, -3], {
            width: 2.2, height: 3.2, label: "ORION_LINK", theme: 'energy'
        });
        env.add(portal2.group);
        env.updatables.push(portal2);

        const info2 = new HaloCard3D(env.scene, env.camera, [0, 0, 0], {
            title: "Orions: Caution Advised", width: 2.5, height: 0.4,
            offset: [0, -2, 0], anchorObject: portal2.group, color: 0xff00ff
        });
        env.add(info2.group);
        env.updatables.push(info2);


        // 4. CMD CONSOLE

        const transmission = new MagneticCard3D(env.scene, env.camera, [0, 0.8, -1.8], {
            width: 2, height: 1.2, color: 0x0a0a20,
            title: "TRANSLATION_FEED", description: "\"Greetings Sol-3. Threshold reached.\""
        });
        env.add(transmission.group);
        env.updatables.push(transmission);

        const relayToggle = new Toggle3D(env.scene, env.camera, [0, -0.2, -1.8], {
            label: "QUANTUM_LINK", width: 2, isOn: true, onColor: 0x00ff88
        });
        env.add(relayToggle.group);
        env.updatables.push(relayToggle);


        // 5. START
        env.start();

    </script>
</body>

</html>
