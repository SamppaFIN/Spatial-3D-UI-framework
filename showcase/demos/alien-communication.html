<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda Relay — Spatial UI 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">
    <link rel="stylesheet" href="../styles/mobile-panel.css">
    <style>
        body { margin: 0; overflow: hidden; background: #030510; font-family: 'Share Tech Mono', 'Inter', monospace; }
        .relay-hud { position: fixed; top: 20px; left: 20px; pointer-events: none; z-index: 10; color: #00ff88; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
        .relay-hud h1 { margin: 0; font-size: 1.2rem; letter-spacing: 3px; }
        .relay-hud .sub { font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }
        .signal-meter { position: fixed; top: 20px; right: 20px; pointer-events: none; z-index: 10; color: #00ff88; font-size: 0.75rem; }
        .signal-meter .bar { width: 100px; height: 6px; background: rgba(0,255,136,0.2); border-radius: 3px; margin: 4px 0; overflow: hidden; }
        .signal-meter .fill { height: 100%; background: #00ff88; border-radius: 3px; transition: width 0.3s; }
        #void { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse, transparent 35%, rgba(3,5,15,0.85) 100%); }
        .relay-panel.demo-controls { position: fixed; bottom: 24px; left: 24px; background: rgba(3,5,20,0.95); border: 1px solid rgba(0,255,136,0.3); border-radius: 12px; padding: 16px; color: #aaffcc; font-size: 0.85rem; max-width: 300px; z-index: 20; }
        .relay-panel h3 { margin: 0 0 6px 0; color: #00ff88; font-size: 0.95rem; }
        @media (max-width: 768px) {
            .relay-hud { top: 12px; left: 12px; } .relay-hud h1 { font-size: 0.9rem; }
            .signal-meter { top: 12px; right: 8px; font-size: 0.65rem; }
            .relay-panel.demo-controls { left:0; right:0; bottom:0; max-width:none; border-radius:20px 20px 0 0; }
        }
    </style>
    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

<body>
    <div id="void"></div>
    <div class="relay-hud"><h1>◆ ANDROMEDA RELAY ◆</h1><div class="sub">Deep Space · First Contact Protocol</div></div>
    <div class="signal-meter">SIGNAL<div class="bar"><div class="fill" id="signalFill" style="width:40%"></div></div><span id="signalPct">40%</span></div>
    <div class="relay-panel demo-controls" id="infoPanel"><h3>👽 Decoder Active</h3><p id="guideText">Signal detected. Match the frequency pattern to decode the alien transmission.</p></div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';
        import { EchoInteraction3D } from '../../src/controls/EchoInteraction3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';

        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 2.0, 5.5], fogDensity: 0.03 });
        env.init();
        env.scene.background = new THREE.Color(0x030510);
        env.scene.fog = new THREE.FogExp2(0x030510, 0.03);
        env.scene.add(new THREE.AmbientLight(0x003322, 0.4));
        const beacon = new THREE.PointLight(0x00ff88, 2, 12); beacon.position.set(0, 4, -3); env.scene.add(beacon);

        // Stars
        const sGeo = new THREE.BufferGeometry(); const sPos = new Float32Array(1200*3);
        for(let i=0;i<1200;i++){ sPos[i*3]=(Math.random()-0.5)*60; sPos[i*3+1]=(Math.random()-0.5)*30+8; sPos[i*3+2]=(Math.random()-0.5)*30-10; }
        sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
        const stars = new THREE.Points(sGeo,new THREE.PointsMaterial({size:0.08,color:0x88ccaa,transparent:true,opacity:0.6}));
        env.scene.add(stars);

        const ghost = new SemanticGhost(env.camera, env.scene, env.renderer); env.add(ghost); env.updatables.push(ghost);

        // ── EchoInteraction3D — UNIQUE: Signal Decoding ──
        let signalStrength = 40;
        const echo = new EchoInteraction3D(env.scene, env.camera, { pulseSpeed: 8, maxRadius: 30, glowColor: 0x00ff88 });
        env.updatables.push({ update: () => echo.update() });

        const signalEl = document.getElementById('signalFill');
        const signalPctEl = document.getElementById('signalPct');

        // Frequency slider
        const freqSlider = new Slider3D(env.scene, env.camera, [4.5, 1.2, -2.5], {
            label: 'FREQ (GHz)', width: 2.2, min: 1, max: 100, value: 40, step: 0.5, color: 0x00ff88,
            onChange: (c,v) => {
                signalStrength = v;
                signalEl.style.width = v + '%';
                signalPctEl.textContent = Math.round(v) + '%';
                echo.pulseSpeed = 3 + (v/100)*15;
                if(v > 80){ ghost.updatePanelText('SIGNAL LOCKED. Decoding alien transmission... "We come in peace from Andromeda."'); echo.glowColor = 0x44ffaa; }
                else if(v > 50){ ghost.updatePanelText('Signal stabilizing. Pattern emerging. Continue tuning.'); echo.glowColor = 0x00ff88; }
                else { ghost.updatePanelText('Weak signal. Adjust frequency to strengthen the connection.'); echo.glowColor = 0x006644; }
            }
        });
        freqSlider.group.rotation.y = -0.35; env.add(freqSlider.group); env.updatables.push(freqSlider);

        // Relay toggle
        const relayToggle = new Toggle3D(env.scene, env.camera, [4.5, -0.2, -2.5], {
            label: 'RELAY LINK', width: 2.2, isOn: true, onColor: 0x00ff88, offColor: 0x334433,
            onClick: (t) => {
                if(t.isOn){ echo.triggerPulse(new THREE.Vector3(0,2,-2)); ghost.updatePanelText('Quantum relay established. Listening for transmissions.'); }
                else{ ghost.updatePanelText('Relay offline. No incoming signals.'); }
            }
        });
        relayToggle.group.rotation.y = -0.35; env.add(relayToggle.group); env.updatables.push(relayToggle);

        // Decode button
        const decodeBtn = new Button3D(env.scene, env.camera, [0, -1.5, -1.5], {
            label: '📡 DECODE TRANSMISSION', width: 3.5, height: 0.8, color: 0x00ff88, mode: 1,
            onClick: () => {
                if(signalStrength > 75){
                    ghost.updatePanelText('✅ TRANSLATION: "Greetings Sol-3. Your signal reached Andromeda. We wish to share knowledge."');
                    echo.triggerPulse(new THREE.Vector3(0,0,0));
                    beacon.intensity = 5; setTimeout(()=>{beacon.intensity=2;},1000);
                } else {
                    ghost.updatePanelText('⚠️ Signal too weak to decode. Increase frequency above 75%.');
                }
            }
        });
        env.add(decodeBtn.group); env.updatables.push(decodeBtn);

        env.updatables.push({ update: (d) => { stars.rotation.y += d*0.02; beacon.intensity += Math.sin(Date.now()*0.004)*d*0.5; } });

        env.start();
        setTimeout(()=>{ ghost.updatePanelText('SIGNAL DETECTED. Unknown origin — Andromeda sector. Begin frequency tuning.'); ghost.guideTo(freqSlider.group, 'Frequency Tuner'); }, 1500);

        const guideText = document.getElementById('guideText');
        const orig = ghost.updatePanelText.bind(ghost); ghost.updatePanelText = (t) => { guideText.textContent = t; orig(t); };
    </script>
    <script src="../scripts/mobile-controls.js"></script>
</body>
</html>
