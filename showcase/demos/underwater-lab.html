<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptune Deep: Underwater Research Station</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000c1a;
            font-family: 'Consolas', monospace;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #00d4ff;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Abyssal vignette */
        #abyss {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0, 10, 20, 0.9) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="abyss"></div>
    <div id="hud">
        <h1>NEPTUNE DEEP STATION</h1>
        <div class="sub">3,200m Below Surface • Hull Intact</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';
        import { EchoInteraction3D } from '../../src/controls/EchoInteraction3D.js';

        // Components
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.5, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x000c1a);
        env.scene.fog = new THREE.FogExp2(0x000c1a, 0.08);

        // Undersea Lights
        const amb = new THREE.AmbientLight(0x004466, 0.5);
        env.scene.add(amb);

        const spot = new THREE.SpotLight(0x00d4ff, 2, 20, 0.6, 1);
        spot.position.set(2, 5, 2);
        env.scene.add(spot);

        // 2. Bubble Particles
        const bubbleGeo = new THREE.BufferGeometry();
        const bubbleCount = 200;
        const bubblePos = new Float32Array(bubbleCount * 3);
        const bubbleSpeeds = new Float32Array(bubbleCount);
        for (let i = 0; i < bubbleCount; i++) {
            bubblePos[i * 3] = (Math.random() - 0.5) * 20;
            bubblePos[i * 3 + 1] = Math.random() * 10;
            bubblePos[i * 3 + 2] = (Math.random() - 0.5) * 20;
            bubbleSpeeds[i] = 0.01 + Math.random() * 0.03;
        }
        bubbleGeo.setAttribute('position', new THREE.BufferAttribute(bubblePos, 3));
        const bubbleMat = new THREE.PointsMaterial({ size: 0.1, color: 0x88ccff, transparent: true, opacity: 0.4 });
        const bubbles = new THREE.Points(bubbleGeo, bubbleMat);
        env.scene.add(bubbles);

        env.updatables.push({
            update: (d) => {
                const pos = bubbleGeo.attributes.position.array;
                for (let i = 0; i < bubbleCount; i++) {
                    pos[i * 3 + 1] += bubbleSpeeds[i];
                    if (pos[i * 3 + 1] > 5) pos[i * 3 + 1] = -5;
                }
                bubbleGeo.attributes.position.needsUpdate = true;
            }
        });


        // 3. AI & Sonar
        const ghost = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(ghost);
        env.updatables.push(ghost);

        const sonar = new EchoInteraction3D(env.scene, env.camera, {
            pulseSpeed: 12, maxRadius: 40, glowColor: 0x00ff88
        });
        env.updatables.push({ update: () => sonar.update() });


        // 4. SPECIMENS (Hidden until Ping)

        // Specimen 1: Giant Squid
        const specimen1 = new VolumetricCard3D(env.scene, env.camera, [-3, 1.2, -3], {
            width: 2.5, height: 1.5, baseColor: 0x112233,
            title: "Architeuthis dux", popHeight: 0.8
        });
        sonar.registerObject(specimen1.baseMesh, {
            onReveal: () => {
                ghost.updatePanelText("ANALYSIS: CEPHALOPOD DETECTED");
                ghost.guideTo(specimen1.group, "Giant Squid Specimen");
            }
        });
        env.add(specimen1.group);
        env.updatables.push(specimen1);

        // Specimen 2: Bioluminescent Species
        const specimen2 = new VolumetricCard3D(env.scene, env.camera, [3, 1.2, -3], {
            width: 2.5, height: 1.5, baseColor: 0x113322,
            title: "Abyssal Flare", popHeight: 0.8
        });
        sonar.registerObject(specimen2.baseMesh, {
            onReveal: () => {
                ghost.updatePanelText("ANALYSIS: PHOSPHORESCENCE DETECTED");
                ghost.guideTo(specimen2.group, "Unnamed Abyssal Organism");
            }
        });
        env.add(specimen2.group);
        env.updatables.push(specimen2);


        // 5. CMD CONTROLS

        const diveLog = new MagneticCard3D(env.scene, env.camera, [0, 0.8, -2], {
            width: 2, height: 1.2, color: 0x001a33,
            title: "DIVE LOG: DAY 89", description: "All systems nominal. Sonar active."
        });
        env.add(diveLog.group);
        env.updatables.push(diveLog);

        const lightSlider = new Slider3D(env.scene, env.camera, [0, -0.2, -2], {
            label: "SONAR FREQUENCY", width: 2, color: 0x00ff88,
            onChange: (c, v) => {
                sonar.pulseSpeed = 5 + (v * 20);
            }
        });
        env.add(lightSlider.group);
        env.updatables.push(lightSlider);


        // 6. START
        env.start();

        setTimeout(() => {
            ghost.updatePanelText("DIVE SYSTEM READY");
            ghost.guideTo(diveLog.group, "Initial Briefing");
            // Initial Ping
            sonar.triggerPulse(new THREE.Vector3(0, 0, 0));
        }, 1500);

    </script>
</body>

</html>
