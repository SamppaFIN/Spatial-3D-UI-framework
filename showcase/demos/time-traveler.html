<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Protocol: Temporal Command</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050210;
            font-family: 'Courier New', monospace;
        }

        #time-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #8080ff;
            text-shadow: 0 0 10px rgba(128, 128, 255, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 5px;
        }

        .sub {
            font-size: 0.8rem;
            color: #ff80ff;
            opacity: 0.8;
        }

        /* Temporal distortion */
        #distortion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(10, 5, 32, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="distortion"></div>
    <div id="time-hud">
        <h1>CHRONOS_CONTROL</h1>
        <div class="sub">Epoch: 2077 CE • Stability: 87%</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { TimeRibbon3D } from '../../src/controls/TimeRibbon3D.js';
        import { AIPortal3D } from '../../src/controls/AIPortal3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x050210);

        // Temporal Lighting
        const amb = new THREE.AmbientLight(0x8080ff, 0.4);
        env.scene.add(amb);

        const flash = new THREE.PointLight(0xff80ff, 1, 10);
        flash.position.set(0, 5, -2);
        env.scene.add(flash);

        // 2. Chronos AI (Ghost)
        const chronos = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(chronos);
        env.updatables.push(chronos);

        setTimeout(() => {
            chronos.updatePanelText("TEMPORAL_ANCHOR_ESTABLISHED");
            chronos.guideTo(scrubber.group, "Scrubbing through Epochs");
        }, 1500);


        // 3. TEMPORAL TOOLS

        // Time Gate (Portal)
        const gate = new AIPortal3D(env.scene, env.camera, [0, 1.8, -3], {
            width: 3, height: 4, label: "TIME_GATE", theme: 'cosmic'
        });
        env.add(gate.group);
        env.updatables.push(gate);

        // Time Ribbon (History)
        const ribbon = new TimeRibbon3D(env.scene, env.camera, [0, 1.8, -3], {
            radius: 2.2, turns: 3, ribbonWidth: 0.15, color: 0x8080ff,
            timeline: [
                { time: 0, label: "Antiquity" },
                { time: 50, label: "Industrial" },
                { time: 100, label: "Singularity" }
            ]
        });
        env.add(ribbon.group);
        env.updatables.push(ribbon);

        // Chronon Scrubber (Slider)
        const scrubber = new Slider3D(env.scene, env.camera, [3.5, 1.5, -2], {
            label: "CHRONON_SCRUBBER", width: 3, color: 0xff80ff,
            onChange: (c, v) => {
                ribbon.setTime(v);
                // Dynamically update portal theme
                if (v > 80) gate.setTheme('cyber');
                else if (v < 20) gate.setTheme('nature'); // nature theme doesn't exist? it uses 'forest' maybe? 
                // checking AIPortal themes: 'cosmic', 'cyber', 'energy', 'void'. 
                // Let's stick to valid ones.
                else gate.setTheme('cosmic');
            }
        });
        scrubber.group.rotation.y = -0.5;
        env.add(scrubber.group);
        env.updatables.push(scrubber);

        // Mission Brief
        const brief = new MagneticCard3D(env.scene, env.camera, [-3.5, 1.5, -2], {
            width: 2.5, height: 3.5, color: 0x100530,
            title: "MISSION_DATA", description: "Target: Paradox in 1969\nRisk: Moderate\nEnergy: 65%"
        });
        brief.group.rotation.y = 0.5;
        env.add(brief.group);
        env.updatables.push(brief);


        // 5. START
        env.start();

    </script>
</body>

</html>
