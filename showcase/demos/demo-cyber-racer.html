<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Racer HUD - Spatial UI 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', sans-serif;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
        }

        .hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8) 0%, transparent 20%, transparent 80%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .speed-readout {
            position: absolute;
            bottom: 50px;
            right: 50px;
            text-align: right;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
        }

        .speed-val {
            font-size: 5em;
            font-weight: 900;
            line-height: 1;
        }

        .speed-unit {
            font-size: 1.5em;
            letter-spacing: 5px;
            opacity: 0.8;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div class="hud-overlay">
        <div class="speed-readout">
            <div class="speed-val" id="speed-display">0</div>
            <div class="speed-unit">KM/H</div>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { HoloMap3D } from '../../src/controls/HoloMap3D.js';
        import { DataVolume3D } from '../../src/controls/DataVolume3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { ControlRegistry } from '../../src/core/ControlRegistry.js';

        // 1. Setup Scene
        const canvas = document.getElementById('canvas');
        const scene3D = new Scene3D(canvas);
        const scene = scene3D.getScene();
        const camera = scene3D.getCamera();

        scene.background = new THREE.Color(0x000005);
        scene.fog = new THREE.FogExp2(0x000005, 0.02);

        // 2. Speed Tunnel Effect
        const tunnelGeo = new THREE.CylinderGeometry(10, 10, 200, 32, 20, true);
        const tunnelMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.1,
            side: THREE.DoubleSide
        });
        const tunnel = new THREE.Mesh(tunnelGeo, tunnelMat);
        tunnel.rotation.x = Math.PI / 2;
        scene.add(tunnel);

        // Moving Streaks
        const streakCount = 500;
        const streakGeo = new THREE.BufferGeometry();
        const streakPos = new Float32Array(streakCount * 3);

        for (let i = 0; i < streakCount * 3; i += 3) {
            streakPos[i] = (Math.random() - 0.5) * 20; // x
            streakPos[i + 1] = (Math.random() - 0.5) * 20; // y
            streakPos[i + 2] = Math.random() * 200 - 100; // z
        }
        streakGeo.setAttribute('position', new THREE.BufferAttribute(streakPos, 3));
        const streakMat = new THREE.PointsMaterial({
            color: 0x0088ff,
            size: 0.1,
            transparent: true,
            opacity: 0.8
        });
        const streaks = new THREE.Points(streakGeo, streakMat);
        scene.add(streaks);

        // 3. Cockpit UI

        // Track Map
        const map = new HoloMap3D(scene, camera, [-3.5, -1.5, -4], {
            width: 3, height: 3,
            scale: 200,
            mapColor: 0xff00ff,
            gridColor: 0x330033
        });
        ControlRegistry.register(map);

        // Fake race track data
        // Circle loop
        const trackPoints = [];
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            trackPoints.push(new THREE.Vector3(
                Math.cos(angle) * 80,
                Math.sin(angle * 3) * 10, // Elevation changes
                Math.sin(angle) * 80
            ));
        }
        // Add track to HoloMap (using custom method mock)
        // HoloMap supports generic objects, so let's add a line
        const trackLineMat = new THREE.LineBasicMaterial({ color: 0xff00ff });
        const trackLineGeo = new THREE.BufferGeometry().setFromPoints(trackPoints);
        const trackLine = new THREE.Line(trackLineGeo, trackLineMat);
        // We attach it to the map's internal group if we can, or just add logic
        // For simplicity in this demo, we add it to the map's group
        map.getGroup().add(trackLine);
        trackLine.scale.set(0.01, 0.01, 0.01); // Scale down to fit map


        // G-Force Meter (DataVolume)
        const gMeter = new DataVolume3D(scene, camera, [3.5, -1.5, -4], {
            width: 2, height: 2, depth: 2,
            label: "G-FORCE",
            color: 0xffff00
        });
        ControlRegistry.register(gMeter);


        // Boost Button
        const boostBtn = new Button3D(scene, camera, [0, -2.5, -3], {
            label: "NITRO BOOST",
            width: 3, height: 0.8,
            color: 0xff3300,
            onClick: () => activateBoost()
        });
        ControlRegistry.register(boostBtn);


        // 4. Logic
        let speed = 0;
        let targetSpeed = 300;
        let boost = false;
        let distance = 0;

        function activateBoost() {
            boost = true;
            targetSpeed = 800;
            scene.fog.color.setHex(0x330000); // Red shift

            setTimeout(() => {
                boost = false;
                targetSpeed = 300;
                scene.fog.color.setHex(0x000005);
            }, 3000);
        }

        const speedDisplay = document.getElementById('speed-display');

        function animate() {
            requestAnimationFrame(animate);

            // Speed physics
            speed += (targetSpeed - speed) * 0.05;
            speedDisplay.innerText = Math.floor(speed);

            // Tunnel movement
            tunnel.rotation.z += 0.001 * (speed / 100);

            // Streak movement (Warp effect)
            const positions = streaks.geometry.attributes.position.array;
            for (let i = 2; i < streakCount * 3; i += 3) {
                positions[i] += speed * 0.5; // Move Z forward
                if (positions[i] > 100) {
                    positions[i] = -100; // Loop
                }
            }
            streaks.geometry.attributes.position.needsUpdate = true;

            // Camera Shake based on speed
            const shake = (speed / 800) * 0.05;
            camera.position.x = (Math.random() - 0.5) * shake;
            camera.position.y = (Math.random() - 0.5) * shake;

            // UI Updates
            map.update();
            map.getGroup().rotation.y += 0.01; // Spin map

            gMeter.update();
            if (Math.random() > 0.8) {
                // Update specific data points to look busy
                // (Simplified update for demo)
            }

            boostBtn.update();

            scene3D.render();
        }
        animate();

    </script>
</body>

</html>
