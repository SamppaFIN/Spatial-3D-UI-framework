<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryo-Stasis - Pod 09</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/showcase.css">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #e0f7fa;
            /* Ice blue start, but canvas covers it */
            color: #005577;
            font-family: 'Exo 2', sans-serif;
        }

        #room-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #html-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }

        #html-overlay-container>* {
            pointer-events: auto;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-title {
            font-size: 2.5rem;
            font-weight: 300;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .hud-subtitle {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            color: #fff;
            font-size: 0.9rem;
            margin-top: 5px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border-radius: 4px;
        }

        .frost-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle, transparent 40%, rgba(200, 230, 255, 0.2) 100%);
        }

        .back-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            pointer-events: auto;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #fff;
            color: #007799;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Loading overlay */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #001122;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div class="frost-overlay"></div>

    <div class="hud-overlay">
        <h1 class="hud-title">POD 09</h1>
        <div class="hud-subtitle">CRYO-STASIS // STABLE</div>
    </div>

    <nav class="back-nav">
        <a href="../index.html" class="back-btn">EXIT MONITOR</a>
    </nav>

    <div id="html-overlay-container"></div>
    <canvas id="room-canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { TextDisplay3D } from '../../src/controls/TextDisplay3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { ControlRegistry } from '../../src/core/ControlRegistry.js';
        import { getHTMLOverlay } from '../../src/utils/HTMLOverlay.js';
        import * as THREE from 'three';

        // 1. Scene Setup
        const canvas = document.getElementById('room-canvas');
        const scene3D = new Scene3D(canvas);
        const scene = scene3D.getScene();
        const camera = scene3D.getCamera();
        const renderer = scene3D.getRenderer();
        const controls = scene3D.getControls();

        ControlRegistry.setOrbitControls(controls);

        // Initialize HTML Overlay
        const htmlOverlay = getHTMLOverlay();
        const overlayContainer = document.getElementById('html-overlay-container');
        htmlOverlay.init(overlayContainer);

        // Cold/Clean Aesthetics
        scene.background = new THREE.Color(0xddeeff);
        scene.fog = new THREE.FogExp2(0xddeeff, 0.03);

        // Lighting - Soft and diffuse
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Cold blue spot
        const mainLight = new THREE.DirectionalLight(0xaaddff, 0.5);
        mainLight.position.set(0, 5, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Camera init
        camera.position.set(0, 1.5, 4.5);
        controls.target.set(0, 1.3, 0);
        controls.enableDamping = true;

        // --- POD MONITOR UI ---

        // Floating Hologram Pane concept
        const glassGeo = new THREE.PlaneGeometry(5, 3.5);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xccffff,
            metalness: 0,
            roughness: 0.1,
            transmission: 0.8,
            thickness: 0.5,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const glassPane = new THREE.Mesh(glassGeo, glassMat);
        glassPane.position.set(0, 1.5, 0);
        scene.add(glassPane);

        // Frame
        const frameGeo = new THREE.BoxGeometry(5.1, 3.6, 0.05);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.set(0, 1.5, -0.01);
        scene.add(frame);


        // --- CONTENT ---

        // Metabolic Rate (Line Chart)
        const metaChart = new Chart3D(scene, camera, [-1.2, 2.3, 0.1], {
            title: 'Metabolic Activity',
            width: 2.2,
            height: 1.2,
            type: 'line',
            data: [5, 4, 3, 3, 2, 2, 2, 2, 3, 3, 4], // Low activity
            color: 0x007799,
            barColor: 0x007799,
            backgroundColor: 'rgba(255, 255, 255, 0.5)'
        });

        // Thaw Progress (Bar Chart)
        const thawChart = new Chart3D(scene, camera, [1.2, 2.3, 0.1], {
            title: 'Thaw Sequence',
            width: 2.2,
            height: 1.2,
            type: 'bar',
            data: [15, 25, 35, 45, 60], // Increasing
            color: 0x00aabb,
            barColor: 0x00aabb,
            backgroundColor: 'rgba(255, 255, 255, 0.5)'
        });


        // Vital Text Panel
        const vitalsHtml = `
            <div style="font-family: 'Exo 2', sans-serif; color: #005577;">
                <div style="font-size: 1.5em; font-weight: bold; margin-bottom: 10px;">SUBJECT: J. DOE</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <div style="font-size: 0.8em; opacity: 0.7;">CORE TEMP</div>
                        <div style="font-size: 1.8em;">-40°C</div>
                    </div>
                    <div>
                        <div style="font-size: 0.8em; opacity: 0.7;">OXYGEN</div>
                        <div style="font-size: 1.8em;">99%</div>
                    </div>
                </div>
                <div style="margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.5); border-radius: 5px;">
                    STATUS: HIBERNATION CYCLE 42<br>
                    Next scheduled wake: +200 years
                </div>
            </div>
        `;

        const vitalsDisplay = new TextDisplay3D(scene, camera, [-1.2, 0.6, 0.1], {
            width: 2.2,
            height: 1.5,
            content: vitalsHtml,
            backgroundColor: 'rgba(255, 255, 255, 0.3)',
            borderColor: '#fff'
        });

        // Control Buttons
        const buttonGroup = new THREE.Group();
        buttonGroup.position.set(1.2, 0.6, 0.1);
        scene.add(buttonGroup); // Actually Button3D adds to scene root, so we place manually

        const btnInject = new Button3D(scene, camera, [1.2, 0.8, 0.15], {
            label: 'INJECT STIMULANT',
            color: 0x00aaff,
            width: 2.0,
            scale: 0.7
        });

        const btnWake = new Button3D(scene, camera, [1.2, 0.3, 0.15], {
            label: 'EMERGENCY WAKE',
            color: 0xff5555,
            width: 2.0,
            scale: 0.7,
            onClick: () => {
                // Flash red
                scene.background = new THREE.Color(0xffcccc);
                setTimeout(() => scene.background = new THREE.Color(0xddeeff), 200);
            }
        });


        // Floating Snow/Dust
        const snowGeo = new THREE.BufferGeometry();
        const snowCount = 1000;
        const snowPos = new Float32Array(snowCount * 3);
        for (let i = 0; i < snowCount * 3; i++) {
            snowPos[i] = (Math.random() - 0.5) * 20;
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        const snowMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.5 });
        const snow = new THREE.Points(snowGeo, snowMat);
        scene.add(snow);

        // Remove loader
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => document.getElementById('loader').remove(), 500);

        function animate() {
            requestAnimationFrame(animate);

            // Updates
            if (metaChart) metaChart.update();
            if (thawChart) thawChart.update();

            // Snow movement
            snow.rotation.y += 0.001;

            scene3D.render();

            if (htmlOverlay && htmlOverlay.render) {
                htmlOverlay.render(camera);
            }
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            if (htmlOverlay && htmlOverlay.setSize) {
                htmlOverlay.setSize(width, height);
            }
        });
    </script>
</body>

</html>
