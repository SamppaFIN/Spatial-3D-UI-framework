<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Aurora Museum: Echoes of Infinity</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0806;
            font-family: 'Georgia', serif;
        }

        #museum-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .sub {
            font-size: 0.9rem;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="museum-hud">
        <h1>THE AURORA MUSEUM</h1>
        <div class="sub">Infinite Gallery • Sector Alpha</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { RadialMenu3D } from '../../src/controls/RadialMenu3D.js';
        import { TextDisplay3D } from '../../src/controls/TextDisplay3D.js';

        // 1. Init
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 6] });
        env.init();
        env.scene.background = new THREE.Color(0x0a0806);
        env.scene.fog = new THREE.Fog(0x0a0806, 5, 25);

        // Ambience
        const amb = new THREE.AmbientLight(0xffffff, 0.4);
        env.scene.add(amb);

        // 2. AI Curator (Ghost)
        const curator = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(curator);
        env.updatables.push(curator);

        setTimeout(() => {
            curator.updatePanelText("CURATOR LOG: EXHIBIT ACTIVE");
            curator.guideTo(exhibit1.group, "Classical Masterpiece");
        }, 1500);


        // 3. EXHIBITS

        // --- Exhibit 1: Renaissance ---
        const exhibit1 = new VolumetricCard3D(env.scene, env.camera, [-3, 1.5, -2], {
            width: 2.2, height: 3, baseColor: 0x221105,
            title: "Classical Ideal", popScale: 0.4
        });
        // Add a "Frame" look
        const frameGeo = new THREE.BoxGeometry(2.4, 3.2, 0.1);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.2, metalness: 0.8 });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.z = -0.06;
        exhibit1.group.add(frame);

        env.add(exhibit1.group);
        env.updatables.push(exhibit1);

        const info1 = new MagneticCard3D(env.scene, env.camera, [-3, 0.5, -1.8], {
            width: 1.2, height: 0.8, color: 0x221105,
            title: "Renaissance", description: "Oil on canvas, c. 1503"
        });
        env.add(info1.group);
        env.updatables.push(info1);


        // --- Exhibit 2: Modernist ---
        const exhibit2 = new VolumetricCard3D(env.scene, env.camera, [3, 1.5, -2], {
            width: 2.2, height: 3, baseColor: 0x051122,
            title: "Neural Vision", popScale: 0.4
        });
        const frame2 = new THREE.Mesh(frameGeo, frameMat);
        frame2.position.z = -0.06;
        exhibit2.group.add(frame2);

        env.add(exhibit2.group);
        env.updatables.push(exhibit2);

        const info2 = new MagneticCard3D(env.scene, env.camera, [3, 0.5, -1.8], {
            width: 1.2, height: 0.8, color: 0x051122,
            title: "AI Artifact", description: "Synthetic reality, 2026"
        });
        env.add(info2.group);
        env.updatables.push(info2);


        // 4. NAVIGATION TOOLS

        const menu = new RadialMenu3D(env.scene, env.camera, [0, 1.5, -3], {
            items: [
                { label: "Classic", icon: "🏛️" },
                { label: "Modern", icon: "🌌" },
                { label: "Exit", icon: "🚪" }
            ],
            onSelect: (m, idx, item) => {
                if (item.label === "Classic") curator.guideTo(exhibit1.group, "Analyzing Renaissance Brushwork");
                if (item.label === "Modern") curator.guideTo(exhibit2.group, "Decoding Neural Latent Space");
            }
        });
        env.add(menu.group);
        env.updatables.push(menu);


        // 5. START
        env.start();

    </script>
</body>

</html>
