<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant #7: Industrial Control Center</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Consolas', monospace;
        }

        #plant-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Industrial grit vignette */
        #grit {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(20, 20, 20, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="grit"></div>
    <div id="plant-hud">
        <h1>MANUFACTURING PLANT #7</h1>
        <div class="sub">Production: 94% • All Systems Nominal</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x1a1a1a);
        env.scene.fog = new THREE.Fog(0x1a1a1a, 5, 20);

        // Warning/Industrial Lighting
        const amb = new THREE.AmbientLight(0x404040, 0.5);
        env.scene.add(amb);

        const cautionLight = new THREE.PointLight(0xf39c12, 2, 12);
        cautionLight.position.set(-5, 4, 0);
        env.scene.add(cautionLight);

        // Grid for floor
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        grid.position.y = -2;
        env.scene.add(grid);


        // 2. Plant AI (Ghost)
        const foreman = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(foreman);
        env.updatables.push(foreman);

        setTimeout(() => {
            foreman.updatePanelText("PRODUCTION_LINE_MONITOR_ACTIVE");
            foreman.guideTo(outputChart.group, "Analyzing Units/Hr Throughput");
        }, 1500);


        // 3. CONTROL TOOLS

        // Output Chart
        const outputChart = new Chart3D(env.scene, env.camera, [0, 1.5, -2.5], {
            width: 4, height: 2.5, chartType: 'line',
            data: {
                labels: ['01', '02', '03', '04', '05'],
                datasets: [{
                    label: 'Output Rate',
                    data: [1800, 1850, 1790, 1920, 1847],
                    borderColor: '#f39c12',
                    backgroundColor: 'rgba(243, 156, 18, 0.1)'
                }]
            }
        });
        env.add(outputChart.group);
        env.updatables.push(outputChart);

        // Maintenance Log
        const log = new MagneticCard3D(env.scene, env.camera, [-4, 1.5, -3], {
            width: 2.2, height: 3.2, color: 0x222222,
            title: "MAINTENANCE_LOG", description: "Line A: Routine Check\nLine B: Serviced\nFilter: Replaced"
        });
        log.group.rotation.y = 0.5;
        env.add(log.group);
        env.updatables.push(log);

        // Performance Stats
        const perf = new Chart3D(env.scene, env.camera, [4, 1.5, -3], {
            width: 3, height: 2, chartType: 'bar',
            data: {
                labels: ['A', 'B', 'C', 'D'],
                datasets: [{
                    label: 'Eff %',
                    data: [94, 87, 96, 91],
                    backgroundColor: 'rgba(39, 174, 96, 0.8)'
                }]
            }
        });
        perf.group.rotation.y = -0.5;
        env.add(perf.group);
        env.updatables.push(perf);


        // 4. INTERACTIVES

        const speedSlider = new Slider3D(env.scene, env.camera, [4, 0, -3], {
            label: "LINE_SPEED", width: 2.5, color: 0x3498db,
            onChange: (c, v) => {
                foreman.updatePanelText(`SPEED_ADJUSTED: ${Math.round(v * 100)}%`);
            }
        });
        speedSlider.group.rotation.y = -0.5;
        env.add(speedSlider.group);
        env.updatables.push(speedSlider);

        const emerToggle = new Toggle3D(env.scene, env.camera, [-4, 0, -3], {
            label: "ALARM_SYST", width: 2.2, isOn: true, onColor: 0xe74c3c
        });
        emerToggle.group.rotation.y = 0.5;
        env.add(emerToggle.group);
        env.updatables.push(emerToggle);


        // 5. STATUS HALOS
        const status1 = new HaloCard3D(env.scene, env.camera, [0, 0, 0], {
            title: "LINE_A: OPTIMAL", width: 1.5, height: 0.35,
            offset: [0, 1.8, 0], anchorObject: log.group, color: 0x27ae60
        });
        env.add(status1.group);
        env.updatables.push(status1);


        // 6. START
        env.start();

    </script>
</body>

</html>
