<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oloid Geometry - Spatial UI 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .info-panel {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            pointer-events: all;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a3c9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ecdc4, #44a3c9);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ecdc4, #44a3c9);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
        }

        .value-display {
            font-size: 13px;
            color: #4ecdc4;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            background: rgba(78, 205, 196, 0.1);
            color: #4ecdc4;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .btn:hover {
            background: rgba(78, 205, 196, 0.2);
            border-color: rgba(78, 205, 196, 0.5);
            transform: translateY(-2px);
        }

        .btn.active {
            background: rgba(78, 205, 196, 0.3);
            border-color: #4ecdc4;
            color: #fff;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            width: 60px;
            height: 36px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: none;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4ecdc4;
        }

        .info-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(78, 205, 196, 0.1);
            border-left: 3px solid #4ecdc4;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-box strong {
            color: #4ecdc4;
            display: block;
            margin-bottom: 6px;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(78, 205, 196, 0.2);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: #4ecdc4;">Loading Oloid...</p>
    </div>

    <div id="ui-overlay">
        <div class="info-panel demo-controls">
            <h1>🌀 The Oloid</h1>
            <p class="subtitle">
                A geometric object discovered by Paul Schatz in 1929. The convex hull of two perpendicular circles.
            </p>

            <div class="control-group">
                <label class="control-label">Radius</label>
                <div class="slider-container">
                    <input type="range" id="radiusSlider" min="0.5" max="2.5" step="0.1" value="1.0">
                    <span class="value-display" id="radiusValue">1.0</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Segments (Quality)</label>
                <div class="slider-container">
                    <input type="range" id="segmentsSlider" min="16" max="128" step="4" value="64">
                    <span class="value-display" id="segmentsValue">64</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Rotation Speed</label>
                <div class="slider-container">
                    <input type="range" id="speedSlider" min="0" max="0.02" step="0.001" value="0.005">
                    <span class="value-display" id="speedValue">0.005</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Color</label>
                <div class="color-picker-container">
                    <input type="color" id="colorPicker" value="#4ecdc4">
                    <span class="value-display" id="colorValue">#4ecdc4</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Material Type</label>
                <div class="button-group">
                    <button class="btn" data-material="standard">Standard</button>
                    <button class="btn active" data-material="metal">Metal</button>
                    <button class="btn" data-material="glass">Glass</button>
                    <button class="btn" data-material="neon">Neon</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Options</label>
                <div class="checkbox-container">
                    <input type="checkbox" id="wireframeCheck">
                    <label for="wireframeCheck">Show Wireframe</label>
                </div>
                <div class="checkbox-container" style="margin-top: 8px;">
                    <input type="checkbox" id="autoRotateCheck" checked>
                    <label for="autoRotateCheck">Auto Rotate</label>
                </div>
            </div>

            <div class="info-box">
                <strong>💡 Interaction Tips</strong>
                Click the oloid to toggle wireframe.<br>
                Hover to see the glow effect.<br>
                Drag to rotate the camera view.
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Inline Oloid3D classes for demo
        class BaseControl3D {
            constructor(scene, camera, position, config) {
                this.scene = scene;
                this.camera = camera;
                this.config = config || {};
                this.group = new THREE.Group();
                this.group.position.set(position[0], position[1], position[2]);
                this.isHovered = false;
            }
            set(key, value) { this.config[key] = value; this.onStateChange(key, value); }
            get(key) { return this.config[key]; }
            onStateChange(key, value, oldValue) { }
            handleClick(intersect) { }
            onHoverChange(isHovered) { this.isHovered = isHovered; }
            update() { }
        }

        // Inline Oloid3D for demo
        class Oloid3D extends BaseControl3D {
            constructor(scene, camera, position = [0, 0, 0], config = {}) {
                super(scene, camera, position, {
                    ...config,
                    radius: config.radius || 1.0,
                    segments: config.segments || 64,
                    color: config.color || 0x4ecdc4,
                    materialType: config.materialType || 'metal',
                    autoRotate: config.autoRotate !== false,
                    rotationSpeed: config.rotationSpeed || 0.005,
                    wireframe: config.wireframe || false,
                    onClick: config.onClick || null
                });

                this.radius = this.get('radius');
                this.segments = this.get('segments');
                this.autoRotate = this.get('autoRotate');
                this.rotationSpeed = this.get('rotationSpeed');
                this.wireframe = this.get('wireframe');
                this.rotationAngle = 0;
                this.currentScale = 1.0;
                this.scaleVelocity = 0;
                this.create();
            }

            create() {
                while (this.group.children.length > 0) {
                    const child = this.group.children[0];
                    this.group.remove(child);
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                }

                const geometry = this.createOloidGeometry();
                const material = this.createMaterial();

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.mesh.userData.isInteractive = true;
                this.mesh.userData.control = this;

                this.group.add(this.mesh);

                if (this.wireframe) {
                    this.createWireframe(geometry);
                }

                this.createGlow();
            }

            createOloidGeometry() {
                const radius = this.radius;
                const segments = this.segments;
                const vertices = [];
                const indices = [];
                const normals = [];
                const uvs = [];

                const circle1Vertices = [];
                const circle2Vertices = [];

                for (let i = 0; i <= segments; i++) {
                    const theta = (i / segments) * Math.PI * 2;
                    const x1 = radius + radius * Math.cos(theta);
                    const y1 = radius * Math.sin(theta);
                    const z1 = 0;
                    circle1Vertices.push(new THREE.Vector3(x1, y1, z1));

                    const x2 = 0;
                    const y2 = radius + radius * Math.cos(theta);
                    const z2 = radius * Math.sin(theta);
                    circle2Vertices.push(new THREE.Vector3(x2, y2, z2));
                }

                for (let i = 0; i < segments; i++) {
                    const v1 = circle1Vertices[i];
                    const v2 = circle1Vertices[i + 1];
                    const v3 = circle2Vertices[i];
                    const v4 = circle2Vertices[i + 1];

                    const baseIndex = vertices.length / 3;
                    vertices.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z);
                    indices.push(baseIndex, baseIndex + 1, baseIndex + 2, baseIndex + 1, baseIndex + 3, baseIndex + 2);

                    const normal1 = new THREE.Vector3();
                    const edge1_1 = new THREE.Vector3().subVectors(v2, v1);
                    const edge2_1 = new THREE.Vector3().subVectors(v3, v1);
                    normal1.crossVectors(edge1_1, edge2_1).normalize();

                    for (let j = 0; j < 4; j++) {
                        normals.push(normal1.x, normal1.y, normal1.z);
                    }

                    const u1 = i / segments;
                    const u2 = (i + 1) / segments;
                    uvs.push(u1, 0, u2, 0, u1, 1, u2, 1);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
                geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                geometry.setIndex(indices);
                geometry.computeVertexNormals();
                geometry.center();

                return geometry;
            }

            createMaterial() {
                const color = this.get('color');
                const materialType = this.get('materialType');

                switch (materialType) {
                    case 'glass':
                        return new THREE.MeshPhysicalMaterial({
                            color: color, metalness: 0.0, roughness: 0.1, transparent: true,
                            opacity: 0.6, transmission: 0.9, thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.1
                        });
                    case 'metal':
                        return new THREE.MeshStandardMaterial({
                            color: color, metalness: 0.9, roughness: 0.2, emissive: color, emissiveIntensity: 0.2
                        });
                    case 'neon':
                        return new THREE.MeshStandardMaterial({
                            color: color, metalness: 0.3, roughness: 0.4, emissive: color,
                            emissiveIntensity: 0.8, transparent: true, opacity: 0.9
                        });
                    default:
                        return new THREE.MeshStandardMaterial({ color: color, metalness: 0.5, roughness: 0.5 });
                }
            }

            createWireframe(geometry) {
                if (this.wireframeMesh) {
                    this.group.remove(this.wireframeMesh);
                    this.wireframeMesh.geometry.dispose();
                    this.wireframeMesh.material.dispose();
                }

                const wireframeGeo = new THREE.WireframeGeometry(geometry);
                const wireframeMat = new THREE.LineBasicMaterial({
                    color: 0xffffff, transparent: true, opacity: 0.3, linewidth: 1
                });

                this.wireframeMesh = new THREE.LineSegments(wireframeGeo, wireframeMat);
                this.group.add(this.wireframeMesh);
            }

            createGlow() {
                const glowGeometry = this.createOloidGeometry();
                glowGeometry.scale(1.05, 1.05, 1.05);

                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: this.get('color'), transparent: true, opacity: 0.15, side: THREE.BackSide
                });

                this.glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                this.glowMesh.visible = false;
                this.group.add(this.glowMesh);
            }

            toggleWireframe() {
                this.wireframe = !this.wireframe;
                this.set('wireframe', this.wireframe);

                if (this.wireframe && !this.wireframeMesh) {
                    this.createWireframe(this.mesh.geometry);
                } else if (this.wireframeMesh) {
                    this.wireframeMesh.visible = this.wireframe;
                }
            }

            handleClick(intersect) {
                super.handleClick(intersect);
                this.toggleWireframe();
                const onClick = this.get('onClick');
                if (onClick && typeof onClick === 'function') {
                    onClick(this);
                }
            }

            onHoverChange(isHovered) {
                super.onHoverChange(isHovered);
                if (this.glowMesh) {
                    this.glowMesh.visible = isHovered;
                }
                this.scaleVelocity = isHovered ? 0.05 : -0.05;
            }

            update() {
                if (this.autoRotate) {
                    this.rotationAngle += this.rotationSpeed;
                    this.group.rotation.x = Math.sin(this.rotationAngle) * 0.3;
                    this.group.rotation.y = this.rotationAngle;
                    this.group.rotation.z = Math.cos(this.rotationAngle * 0.7) * 0.2;
                }

                const targetScale = this.isHovered ? 1.1 : 1.0;
                const scaleDiff = targetScale - this.currentScale;
                this.scaleVelocity += scaleDiff * 0.1;
                this.scaleVelocity *= 0.8;
                this.currentScale += this.scaleVelocity;
                this.group.scale.setScalar(this.currentScale);

                super.update();
            }

            onStateChange(key, value, oldValue) {
                const criticalKeys = ['radius', 'segments', 'color', 'materialType', 'wireframe'];
                if (criticalKeys.includes(key)) {
                    this.create();
                }
                if (key === 'autoRotate') this.autoRotate = value;
                if (key === 'rotationSpeed') this.rotationSpeed = value;
                super.onStateChange(key, value, oldValue);
            }
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 10, 50);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(4, 3, 5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 20;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(5, 5, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4ecdc4, 0.3);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0x44a3c9, 0.5);
        rimLight.position.set(0, -5, 5);
        scene.add(rimLight);

        // Create Oloid
        let oloid = new Oloid3D(scene, camera, [0, 0, 0], {
            radius: 1.0,
            segments: 64,
            color: 0x4ecdc4,
            materialType: 'metal',
            autoRotate: true,
            rotationSpeed: 0.005,
            wireframe: false,
            onClick: (ctrl) => console.log('Oloid clicked!', ctrl)
        });

        scene.add(oloid.group);

        // Add ground plane
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x0f0f19,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x4ecdc4, 0x1a1a2e);
        gridHelper.position.y = -1.49;
        scene.add(gridHelper);

        // Raycaster for interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(oloid.mesh, true);

            if (intersects.length > 0) {
                if (!oloid.isHovered) {
                    oloid.onHoverChange(true);
                }
            } else {
                if (oloid.isHovered) {
                    oloid.onHoverChange(false);
                }
            }
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(oloid.mesh, true);

            if (intersects.length > 0) {
                oloid.handleClick(intersects[0]);
            }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onMouseClick);

        // UI Controls
        const radiusSlider = document.getElementById('radiusSlider');
        const radiusValue = document.getElementById('radiusValue');
        const segmentsSlider = document.getElementById('segmentsSlider');
        const segmentsValue = document.getElementById('segmentsValue');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const colorPicker = document.getElementById('colorPicker');
        const colorValue = document.getElementById('colorValue');
        const wireframeCheck = document.getElementById('wireframeCheck');
        const autoRotateCheck = document.getElementById('autoRotateCheck');
        const materialButtons = document.querySelectorAll('.btn[data-material]');

        radiusSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            radiusValue.textContent = value.toFixed(1);
            oloid.set('radius', value);
        });

        segmentsSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            segmentsValue.textContent = value;
            oloid.set('segments', value);
        });

        speedSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            speedValue.textContent = value.toFixed(3);
            oloid.set('rotationSpeed', value);
        });

        colorPicker.addEventListener('input', (e) => {
            const color = e.target.value;
            colorValue.textContent = color;
            const hexColor = parseInt(color.replace('#', '0x'));
            oloid.set('color', hexColor);
        });

        wireframeCheck.addEventListener('change', (e) => {
            oloid.set('wireframe', e.target.checked);
        });

        autoRotateCheck.addEventListener('change', (e) => {
            oloid.set('autoRotate', e.target.checked);
        });

        materialButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                materialButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                oloid.set('materialType', btn.dataset.material);
            });
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            oloid.update();

            renderer.render(scene, camera);
        }

        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        // Hide loading screen and start animation
        document.getElementById('loading').style.display = 'none';
        animate();
    </script>
    <script type="module" src="../scripts/mobile-controls.js"></script>
</body>

</html>
