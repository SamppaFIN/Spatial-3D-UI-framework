<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial UI - Semantic Ghost Demo</title>
    <meta name="version" content="3.0-fixed">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        p {
            margin: 5px 0 0 0;
            opacity: 0.7;
            font-size: 14px;
        }

        .key {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 12px;
            margin: 0 2px;
        }

        /* Chat Overlay */
        #chat-overlay {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 350px;
            height: 500px;
            background: rgba(10, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: none;
            /* Hidden by default */
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', sans-serif;
            z-index: 100;
        }

        #chat-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px 12px 0 0;
        }

        #chat-title {
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        #chat-close:hover {
            color: #fff;
        }

        #chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: #ccc;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-system {
            color: #88ccff;
            font-style: italic;
            font-size: 12px;
            text-align: center;
            margin: 10px 0;
        }

        .msg-user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 12px 12px 0 12px;
            color: #fff;
        }

        .msg-ai {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 12px 12px 12px 0;
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #chat-footer {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #chat-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        #chat-input:focus {
            border-color: #00ccff;
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>Semantic Ghost</h1>
        <p>Your always-on Holo-Companion. It scans what you look at.</p>
        <p><strong>Instructions:</strong> Look at an artifact. The drone will scan and fly to it.</p>
        <p><strong>Interact:</strong> <span class="key">Click</span> drone to Chat. <span class="key">H</span> to Toggle
            Visibility.</p>
    </div>

    <!-- 2D Chat Interface -->
    <div id="chat-overlay">
        <div id="chat-header">
            <div id="chat-title"><span>🤖</span> <span>Holo-Companion</span></div>
            <button id="chat-close" title="Dismiss Ghost">✕</button>
        </div>
        <div id="chat-body">
            <div class="msg-system">Secure Channel Established</div>
            <div class="msg-ai">Greetings. How can I assist you?</div>
        </div>
        <div id="chat-footer">
            <input type="text" id="chat-input" placeholder="Type a message...">
        </div>
    </div>

    <script type="module">
        console.log("Spatial UI: Ghost Demo 3.0 Loaded");
        import * as THREE from 'three';
        import { SpatialControls } from '../../src/controls/SpatialControls.js';
        import { StarfieldBackground } from '../../src/environments/StarfieldBackground.js';
        import { CoordinatePlane } from '../../src/environments/CoordinatePlane.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Setup Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000005, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Environment
        const starfield = new StarfieldBackground(scene);
        const grid = new CoordinatePlane(scene, 50, 50);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // --- Artifacts ---
        const pedestalGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.0, 32);
        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });

        function createArtifact(x, color, shape, helpText) {
            const group = new THREE.Group();
            group.position.set(x, 0, 0);

            // Pedestal
            const ped = new THREE.Mesh(pedestalGeo, pedestalMat);
            ped.position.y = 0.5;
            group.add(ped);

            // Artifact
            let artifact;
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.2,
                metalness: 0.8,
                emissive: color,
                emissiveIntensity: 0.2
            });

            if (shape === 'cube') artifact = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat);
            else if (shape === 'sphere') artifact = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), mat);
            else if (shape === 'torus') artifact = new THREE.Mesh(new THREE.TorusKnotGeometry(0.25, 0.1, 100, 16), mat);

            artifact.position.y = 1.3;
            // Add metadata for Ghost!
            artifact.userData.helpText = helpText;

            group.add(artifact);
            scene.add(group);
            return artifact;
        }

        const artifact1 = createArtifact(-2, 0xff0055, 'cube', "Quantum Cube: Stores infinite data in a super-position.");
        const artifact2 = createArtifact(0, 0x00aaff, 'sphere', "Orb of Insight: Direct neural interface for galactic knowledge.");
        const artifact3 = createArtifact(2, 0xffaa00, 'torus', "Chronal Knot: A localized time-loop generator.");

        // --- Semantic Ghost ---
        const ghost = new SemanticGhost(camera, scene, renderer);
        scene.add(ghost);

        // Controls
        const controls = new SpatialControls(camera, renderer.domElement, scene);

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            controls.update(delta);
            starfield.update(time);
            ghost.update(delta, time);

            // Float artifacts
            artifact1.rotation.y = time * 0.5;
            artifact1.position.y = 1.3 + Math.sin(time) * 0.05;

            artifact2.rotation.y = time * 0.3;
            artifact2.position.y = 1.3 + Math.sin(time * 1.2) * 0.05;

            artifact3.rotation.x = time * 0.4;
            artifact3.rotation.y = time * 0.6;
            artifact3.position.y = 1.3 + Math.sin(time * 0.8) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // --- Interaction Logic ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const chatOverlay = document.getElementById('chat-overlay');
        const chatClose = document.getElementById('chat-close');
        const chatInput = document.getElementById('chat-input');
        let isChatOpen = false;

        function toggleChat(open) {
            isChatOpen = open;
            chatOverlay.style.display = open ? 'flex' : 'none';
            if (open) {
                controls.enabled = false; // Disable camera movement
                chatInput.focus();
            } else {
                controls.enabled = true;
            }
        }

        // Dismiss Ghost Logic
        chatClose.addEventListener('click', () => {
            toggleChat(false);
            ghost.setVisible(false); // Dismiss ghost
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const text = chatInput.value;
                if (!text) return;

                // Add User message
                const body = document.getElementById('chat-body');
                const userMsg = document.createElement('div');
                userMsg.className = 'msg-user';
                userMsg.textContent = text;
                body.appendChild(userMsg);

                chatInput.value = '';

                // Fake AI reply after delay
                setTimeout(() => {
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'msg-ai';
                    aiMsg.textContent = `I received: "${text}". Analysis complete.`;
                    body.appendChild(aiMsg);
                    body.scrollTop = body.scrollHeight;
                }, 600);
            }
        });

        // Click to Open
        window.addEventListener('click', (event) => {
            if (isChatOpen) return; // Ignore scene clicks if chat is open

            // Calculate mouse position
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(ghost.children, true);

            if (intersects.length > 0) {
                if (ghost.visible) {
                    toggleChat(true);
                }
            }
        });

        // Keybinds
        window.addEventListener('keydown', (e) => {
            // 'H' to Toggle Ghost
            if (e.key.toLowerCase() === 'h') {
                if (ghost.visible) {
                    // If visible, hide it (and close chat if open)
                    ghost.setVisible(false);
                    if (isChatOpen) toggleChat(false);
                } else {
                    // Summon
                    ghost.setVisible(true);
                }
            }

            // 'P' to Switch Persona
            if (e.key.toLowerCase() === 'p') {
                const current = ghost.currentPersona.name.toLowerCase();
                const next = current === 'aurora' ? 'infinite' : 'aurora';
                ghost.setPersona(next);
                console.log(`Switched to ${next}`);
            }
        });

        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
