<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Live: Virtual Metaverse Arena</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0015;
            font-family: 'Arial', sans-serif;
        }

        #concert-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            color: #00ffff;
            opacity: 0.8;
        }

        /* Neon vignette */
        #neon-wash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(10, 0, 21, 0.7) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="neon-wash"></div>
    <div id="concert-hud">
        <h1>AURORA LIVE XR</h1>
        <div class="sub">Attendance: 47,892 • Energy: PEAK</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { FlowFieldController3D } from '../../src/controls/FlowFieldController3D.js';
        import { AIPortal3D } from '../../src/controls/AIPortal3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { RadialMenu3D } from '../../src/controls/RadialMenu3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x0a0015);

        // Concert Lighting
        const amb = new THREE.AmbientLight(0xff00ff, 0.4);
        env.scene.add(amb);

        const spot = new THREE.SpotLight(0x00ffff, 4, 20, 0.5, 1);
        spot.position.set(0, 8, 2);
        env.scene.add(spot);

        // 2. V-Host AI (Ghost)
        const vHost = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(vHost);
        env.updatables.push(vHost);

        setTimeout(() => {
            vHost.updatePanelText("WELCOME TO THE METAVERSE TOUR");
            vHost.guideTo(nowPlaying.group, "Currently: Digital Dreams");
        }, 1500);


        // 3. STAGE TOOLS

        // Flow Field Center (Stage Visuals)
        const flow = new FlowFieldController3D(env.scene, env.camera, [0, 1.8, -3], {
            pointCount: 2000, color: 0x00ffff, spread: 5
        });
        env.add(flow.group);
        env.updatables.push(flow);

        // Backstage Entrance (Portal)
        const stageGate = new AIPortal3D(env.scene, env.camera, [4, 1.8, -3], {
            width: 2.2, height: 3.5, label: "BACKSTAGE", theme: 'cyber'
        });
        env.add(stageGate.group);
        env.updatables.push(stageGate);


        // 4. NOW PLAYING

        const nowPlaying = new HaloCard3D(env.scene, env.camera, [0, 1, -1.5], {
            title: "NOW PLAYING", description: "Aurora - Digital Dreams (Remix)",
            width: 2.5, height: 0.6, color: 0xff00ff
        });
        env.add(nowPlaying.group);
        env.updatables.push(nowPlaying);

        // Mixer Sliders
        const bassSlider = new Slider3D(env.scene, env.camera, [-4, 2, -3], {
            label: "BASS_BOOST", width: 2.5, color: 0x00ffff,
            onChange: (c, v) => {
                flow.speed = 1 + (v * 5);
                spot.intensity = 2 + (v * 6);
            }
        });
        bassSlider.group.rotation.y = 0.4;
        env.add(bassSlider.group);
        env.updatables.push(bassSlider);

        // Camera Menu
        const camMenu = new RadialMenu3D(env.scene, env.camera, [-4, 0.8, -3], {
            items: [
                { label: "Front", icon: "📷" },
                { label: "Pit", icon: "🔥" },
                { label: "Drone", icon: "🛸" }
            ],
            onSelect: (m, idx, item) => {
                vHost.updatePanelText(`SWITCHING_ANGLE: ${item.label.toUpperCase()}`);
            }
        });
        camMenu.group.rotation.y = 0.4;
        env.add(camMenu.group);
        env.updatables.push(camMenu);


        // 5. START
        env.start();

    </script>
</body>

</html>
