<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Bay 2050: Clinical Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #eef4f9;
            font-family: 'Inter', sans-serif;
        }

        #med-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #2c98f0;
            text-shadow: 0 0 5px rgba(44, 152, 240, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .sub {
            font-size: 0.8rem;
            color: #555;
        }

        /* Sterile vignette */
        #sterile {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(200, 220, 240, 0.4) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="sterile"></div>
    <div id="med-hud">
        <h1>MED-BAY SECTOR 4</h1>
        <div class="sub">Patient #4521 • Stable Condition</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 4] });
        env.init();
        env.scene.background = new THREE.Color(0xeef4f9);
        env.scene.fog = new THREE.Fog(0xeef4f9, 5, 20);

        // Clinical Lighting
        const amb = new THREE.AmbientLight(0xffffff, 0.7);
        env.scene.add(amb);

        const surgeryLight = new THREE.SpotLight(0xffffff, 1.5, 10, 0.4);
        surgeryLight.position.set(0, 5, 0);
        env.scene.add(surgeryLight);

        // 2. Med AI (Ghost)
        const medAI = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(medAI);
        env.updatables.push(medAI);

        setTimeout(() => {
            medAI.updatePanelText("DIAGNOSTIC SYSTEM ONLINE");
            medAI.guideTo(vitalsHub.group, "Scanning Patient Vitals");
        }, 1500);


        // 3. CLINICAL TOOLS

        // Patient Records
        const records = new MagneticCard3D(env.scene, env.camera, [-3, 1.5, -2], {
            width: 2.2, height: 3, color: 0xffffff,
            title: "PATIENT RECORD", description: "Name: John Doe\nAge: 45\nStatus: Post-Op"
        });
        records.group.rotation.y = 0.3;
        env.add(records.group);
        env.updatables.push(records);

        // Vitals Hub
        const vitalsHub = new THREE.Group();
        vitalsHub.position.set(3, 1.5, -2);
        vitalsHub.rotation.y = -0.3;
        env.scene.add(vitalsHub);

        const heartChart = new Chart3D(env.scene, env.camera, [0, 0, 0], {
            width: 2.5, height: 1.5, chartType: 'line',
            data: {
                labels: ['T1', 'T2', 'T3', 'T4', 'T5'],
                datasets: [{
                    label: 'BPM',
                    data: [70, 72, 68, 75, 71],
                    borderColor: '#5cb85c',
                    backgroundColor: 'rgba(92, 184, 92, 0.1)'
                }]
            }
        });
        vitalsHub.add(heartChart.group);
        env.updatables.push(heartChart);

        // Float labels
        const labels = ["Heart Rate: 72", "O2: 98%", "Temp: 37.1°C"];
        labels.forEach((text, i) => {
            const h = new HaloCard3D(env.scene, env.camera, [0, 0, 0], {
                title: text, width: 1.8, height: 0.35,
                offset: [0, 0.8 + i * 0.5, 0], anchorObject: heartChart.group,
                color: 0x5cb85c
            });
            env.add(h.group);
            env.updatables.push(h);
        });


        // 4. SCANNER DISPLAY
        const scanner = new VolumetricCard3D(env.scene, env.camera, [0, 0.5, -1], {
            width: 1.5, height: 1.5, baseColor: 0x4a90e2, title: "ORGAN_SCAN", popHeight: 0.8
        });
        env.add(scanner.group);
        env.updatables.push(scanner);


        // 5. START
        env.start();

    </script>
</body>

</html>
