<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merlin's Workshop: Arcane Interface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0515;
            font-family: 'Georgia', serif;
        }

        #magic-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #d4a5ff;
            text-shadow: 0 0 12px rgba(212, 165, 255, 0.7);
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 3px;
        }

        .sub {
            font-size: 0.8rem;
            font-style: italic;
            opacity: 0.8;
        }

        /* Aetheric fog */
        #aether {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(20, 0, 40, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="aether"></div>
    <div id="magic-hud">
        <h1>THE ARCANE WORKSHOP</h1>
        <div class="sub">Level 7 Mana Chamber • Sanctum Active</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { RadialMenu3D } from '../../src/controls/RadialMenu3D.js';
        import { AIPortal3D } from '../../src/controls/AIPortal3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x0a0515);
        env.scene.fog = new THREE.FogExp2(0x0a0515, 0.06);

        // Mystical Lights
        const amb = new THREE.AmbientLight(0xd4a5ff, 0.3);
        env.scene.add(amb);

        const crystalLight = new THREE.PointLight(0x00ffff, 2, 10);
        crystalLight.position.set(0, 4, -2);
        env.scene.add(crystalLight);

        // 2. AI Familiar (Ghost)
        const familiar = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(familiar);
        env.updatables.push(familiar);

        setTimeout(() => {
            familiar.updatePanelText("RECEPTACLE READY: CHOOSE ELEMENT");
            familiar.guideTo(elementalMenu.group, "Select Arcane Path");
        }, 1500);


        // 3. ARCANE TOOLS

        // Elemental Menu
        const elementalMenu = new RadialMenu3D(env.scene, env.camera, [0, 1.5, -2], {
            items: [
                { label: "Fire", icon: "🔥" },
                { label: "Ice", icon: "❄️" },
                { label: "Aether", icon: "🌀" }
            ],
            onSelect: (m, idx, item) => {
                familiar.updatePanelText(`CHANNELING: ${item.label.toUpperCase()}`);
                if (item.label === "Fire") portal.setTheme('fire');
                if (item.label === "Ice") portal.setTheme('ice');
                if (item.label === "Aether") portal.setTheme('cyber'); // Use cyber for aether look
            }
        });
        env.add(elementalMenu.group);
        env.updatables.push(elementalMenu);

        // Dimensional Portal
        const portal = new AIPortal3D(env.scene, env.camera, [3.5, 1.8, -3], {
            width: 2.5, height: 3.5, label: "CONJURE REACH", theme: 'cosmic'
        });
        env.add(portal.group);
        env.updatables.push(portal);

        // Grimoire Log
        const grimoire = new MagneticCard3D(env.scene, env.camera, [-3.5, 1.8, -3], {
            width: 2.2, height: 3.2, color: 0x1a0a2e,
            title: "THE GRIMOIRE", description: "Incantations logged. Mana flowing."
        });
        env.add(grimoire.group);
        env.updatables.push(grimoire);


        // 4. ESSENCE DISPLAYS
        const essence1 = new VolumetricCard3D(env.scene, env.camera, [-1.5, 0.5, -1], {
            width: 1, height: 1, baseColor: 0xff4400, title: "SOL", popHeight: 0.5
        });
        env.add(essence1.group);
        env.updatables.push(essence1);

        const essence2 = new VolumetricCard3D(env.scene, env.camera, [1.5, 0.5, -1], {
            width: 1, height: 1, baseColor: 0x00ccff, title: "LUNA", popHeight: 0.5
        });
        env.add(essence2.group);
        env.updatables.push(essence2);


        // 5. START
        env.start();

    </script>
</body>

</html>
