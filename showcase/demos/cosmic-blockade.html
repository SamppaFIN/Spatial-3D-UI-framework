<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Blockade: Spatial Edition 🌌</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --cosmic-cyan: #00d4ff;
            --aurora-pink: #ff0055;
            --deep-space: #020205;
            --glass: rgba(10, 15, 30, 0.8);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--deep-space);
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, var(--cosmic-cyan) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            opacity: 0.7;
        }

        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
            background: var(--glass);
            padding: 60px;
            border-radius: 30px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.1);
            transition: opacity 0.5s, transform 0.5s;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, var(--cosmic-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .btn-aurora {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px 50px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-aurora:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.4);
            background: var(--cosmic-cyan);
        }

        #hud-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            pointer-events: none;
        }

        .score-box {
            font-family: 'Fira Code', monospace;
            font-size: 3rem;
            color: var(--cosmic-cyan);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header">
            <div class="logo">COSMIC<span>BLOCKADE</span></div>
        </div>

        <div id="hud-container">
            <div style="font-size: 0.8rem; letter-spacing: 2px; color: rgba(255,255,255,0.4);">CONSCIOUSNESS SCORE</div>
            <div class="score-box" id="score-val">000000</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Cosmic Blockade: Krakout Edition</h1>
        <p>A 3D Homage to the C64 Classic</p>
        <div style="margin: 30px 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.9em;">
            <div>🛡️ <strong>SHIELD (P):</strong> Safety Floor (One hit)</div>
            <div>💣 <strong>BOMB (B):</strong> Explosive hits</div>
            <div>🚀 <strong>MISSILE (M):</strong> Shoot blocks (Click to fire)</div>
            <div>🧲 <strong>GLUE (G):</strong> Ball sticks to paddle</div>
            <div>👾 <strong>MONSTERS:</strong> Watch out for deflections!</div>
        </div>
        <button class="btn-aurora" id="start-button">Engage Core</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { CosmicBlockade } from './CosmicBlockade.js';

        // --- Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.01);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 10;

        // --- Post Processing ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const blueLight = new THREE.PointLight(0x00d4ff, 10, 20);
        blueLight.position.set(5, 5, 5);
        scene.add(blueLight);

        const pinkLight = new THREE.PointLight(0xff0055, 5, 20);
        pinkLight.position.set(-5, -5, 5);
        scene.add(pinkLight);

        // --- Starfield ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 100;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- Game Instance ---
        const game = new CosmicBlockade(scene, camera, renderer);

        // --- Interaction ---
        document.getElementById('start-button').addEventListener('click', () => {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            startScreen.style.transform = 'translate(-50%, -50%) scale(1.1)';
            setTimeout(() => {
                startScreen.style.display = 'none';
                game.start();
            }, 500);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            game.update(delta);
            controls.update();

            // Stats Update
            document.getElementById('score-val').textContent = game.score.toString().padStart(6, '0');

            // Visual Flair
            stars.rotation.y = time * 0.02;

            composer.render();
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
