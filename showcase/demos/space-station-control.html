<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora-7 Command — Spatial UI 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">
    <link rel="stylesheet" href="../styles/mobile-panel.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
        }

        .aurora-hud {
            position: fixed;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .aurora-hud h1 {
            margin: 0;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            letter-spacing: 3px;
        }
        .aurora-hud .sub {
            font-size: 0.7rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* Timeline indicator */
        .timeline-label {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
            color: #00e5ff;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
            opacity: 0.6;
        }

        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(ellipse, transparent 60%, rgba(0, 5, 15, 0.7) 100%);
        }

        .aurora-panel.demo-controls {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(5, 10, 25, 0.92);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            color: #aaccff;
            font-size: 0.85rem;
            max-width: 300px;
            z-index: 20;
            backdrop-filter: blur(10px);
        }
        .aurora-panel h3 { margin: 0 0 6px 0; color: #00e5ff; font-size: 0.95rem; }

        @media (max-width: 768px) {
            .aurora-hud { top: 12px; left: 12px; }
            .aurora-hud h1 { font-size: 0.95rem; letter-spacing: 2px; }
            .timeline-label { bottom: 80px; font-size: 0.65rem; }
            .aurora-panel.demo-controls {
                left: 0; right: 0; bottom: 0;
                max-width: none;
                border-radius: 20px 20px 0 0;
            }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="vignette"></div>

    <div class="aurora-hud">
        <h1>◆ AURORA-7 ◆ FLEET COMMAND</h1>
        <div class="sub">SECTOR 9 · DEEP ORBIT · 14 VESSELS</div>
    </div>
    <div class="timeline-label" id="timelineLabel">T: NOW</div>

    <div class="aurora-panel demo-controls" id="infoPanel">
        <h3>🛰️ Fleet Network Monitor</h3>
        <p id="guideText">14 vessels tracked. Network topology stable. Use timeline to review past formations.</p>
        <p style="font-size:0.7rem;opacity:0.4;margin-top:8px;">← Swipe down on mobile</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';
        import { NetworkGraph3D } from '../../src/controls/NetworkGraph3D.js';
        import { ChronoLens3D } from '../../src/controls/ChronoLens3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';

        // ── 1. Environment ──
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 2.2, 6], fogDensity: 0.01 });
        env.init();
        env.scene.background = new THREE.Color(0x010515);

        // Starfield
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1500;
        const starsPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            starsPositions[i * 3] = (Math.random() - 0.5) * 80;
            starsPositions[i * 3 + 1] = (Math.random() - 0.5) * 50 + 8;
            starsPositions[i * 3 + 2] = (Math.random() - 0.5) * 40 - 10;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
            size: 0.1, color: 0x8899cc, transparent: true, opacity: 0.7
        }));
        env.scene.add(stars);

        // ── 2. Fleet AI ──
        const ghost = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(ghost);
        env.updatables.push(ghost);

        // ── 3. NetworkGraph3D — UNIQUE: Fleet Topology ──
        const fleetNodes = [
            { id: 'AURORA', x: 0, y: 0, z: 0, group: 'command', label: 'AURORA-7' },
            { id: 'SENTINEL', x: 4, y: 1.5, z: -2, group: 'cruiser', label: 'USS Sentinel' },
            { id: 'VALIANT', x: -3, y: -0.5, z: -3, group: 'frigate', label: 'USS Valiant' },
            { id: 'HORIZON', x: 2, y: -2, z: -1, group: 'science', label: 'USS Horizon' },
            { id: 'DAUNTLESS', x: -4, y: 1, z: -2, group: 'cruiser', label: 'USS Dauntless' },
            { id: 'PATROL-A', x: 6, y: -1, z: -4, group: 'frigate', label: 'Patrol A' },
            { id: 'PATROL-B', x: -5, y: -2, z: -3, group: 'frigate', label: 'Patrol B' },
            { id: 'RESUPPLY', x: 1, y: 3, z: -5, group: 'supply', label: 'USNS Resupply' }
        ];

        const fleetEdges = [
            { from: 'AURORA', to: 'SENTINEL' },
            { from: 'AURORA', to: 'VALIANT' },
            { from: 'AURORA', to: 'HORIZON' },
            { from: 'AURORA', to: 'DAUNTLESS' },
            { from: 'SENTINEL', to: 'PATROL-A' },
            { from: 'DAUNTLESS', to: 'PATROL-B' },
            { from: 'AURORA', to: 'RESUPPLY' }
        ];

        const fleetGraph = new NetworkGraph3D(env.scene, env.camera, [0, 1.5, -3], {
            width: 8,
            height: 5,
            depth: 4,
            nodes: fleetNodes,
            edges: fleetEdges,
            nodeScale: 0.3,
            edgeColor: 0x00e5ff
        });
        env.add(fleetGraph.group);
        env.updatables.push(fleetGraph);

        // ── 4. ChronoLens3D — UNIQUE: Timeline Replay ──
        const chronoLens = new ChronoLens3D(env.scene, env.camera, [0, -0.5, -1.5], {
            width: 5,
            height: 0.8,
            timeRange: 24, // 24 hours of history
            currentTime: 0  // 0 = now, 24 = 24h ago
        });
        env.add(chronoLens.group);
        env.updatables.push(chronoLens);

        let timelineOffset = 0; // hours ago

        // ── 5. Shield Toggle ──
        const shieldToggle = new Toggle3D(env.scene, env.camera, [-4.5, 2.0, -1.5], {
            label: 'FLEET SHIELDS',
            width: 2.2,
            isOn: true,
            onColor: 0x00e5ff,
            offColor: 0x334455,
            onClick: (t) => {
                ghost.updatePanelText(t.isOn
                    ? 'Fleet shields: ACTIVE. All vessels protected.'
                    : '⚠️ Fleet shields: OFFLINE. Vessels running on individual deflectors.');
            }
        });
        shieldToggle.group.rotation.y = 0.4;
        env.add(shieldToggle.group);
        env.updatables.push(shieldToggle);

        // ── 6. Timeline Scrubber ──
        const timeSlider = new Slider3D(env.scene, env.camera, [4.5, 1.5, -1.5], {
            label: 'TIMELINE (h)',
            width: 2.2,
            min: 0,
            max: 24,
            value: 0,
            step: 0.5,
            color: 0x00e5ff,
            onChange: (ctrl, val) => {
                timelineOffset = val;
                const label = document.getElementById('timelineLabel');
                if (val === 0) {
                    label.textContent = 'T: NOW';
                } else {
                    label.textContent = `T: -${val.toFixed(1)}h`;
                }

                // Shift fleet nodes based on historical position
                const timeFactor = val / 24;
                fleetGraph.nodes.forEach((node, i) => {
                    if (node.id !== 'AURORA') {
                        // Simulate orbital drift over time
                        const angle = i * Math.PI / 4 + timeFactor * Math.PI;
                        node.x = Math.cos(angle) * (3 + i);
                        node.z = Math.sin(angle) * (2 + i * 0.5) - 3;
                    }
                });
                fleetGraph.refresh();

                ghost.updatePanelText(val > 0
                    ? `Replaying fleet positions from ${val.toFixed(1)} hours ago.`
                    : 'Live fleet positions. All vessels at current stations.');
            }
        });
        timeSlider.group.rotation.y = -0.4;
        env.add(timeSlider.group);
        env.updatables.push(timeSlider);

        // ── 7. Emergency Broadcast Button ──
        const broadcastBtn = new Button3D(env.scene, env.camera, [0, -1.2, -1], {
            label: '📡 FLEET BROADCAST',
            width: 3,
            height: 0.8,
            color: 0xffaa00,
            mode: 1,
            onClick: () => {
                ghost.updatePanelText('📡 BROADCAST: All fleet vessels, report status. Aurora-7 command standing by.');
                // Flash the network edges
                fleetGraph.edgeColor = 0xffffff;
                setTimeout(() => { fleetGraph.edgeColor = 0x00e5ff; fleetGraph.refresh(); }, 800);
            }
        });
        env.add(broadcastBtn.group);
        env.updatables.push(broadcastBtn);

        // ── 8. Animation ──
        env.updatables.push({
            update: (delta) => {
                stars.rotation.y += delta * 0.03;
            }
        });

        // ── 9. Start ──
        env.start();

        setTimeout(() => {
            ghost.updatePanelText("FLEET COMMAND ONLINE. 14 vessels tracked. Network topology stable.");
            ghost.guideTo(fleetGraph.group, "Fleet Formation Network");
        }, 1500);

        // ── 10. Guide text sync ──
        const guideText = document.getElementById('guideText');
        const origUpdate = ghost.updatePanelText.bind(ghost);
        ghost.updatePanelText = (text) => {
            guideText.textContent = text;
            origUpdate(text);
        };
    </script>

    <script src="../scripts/mobile-controls.js"></script>
</body>

</html>
