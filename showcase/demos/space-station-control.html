<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Station Aurora-7: Command Deck</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
        }

        #hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Cinematic vignettes */
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0, 10, 20, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="vignette"></div>
    <div id="hud-overlay">
        <h1>AURORA-7 COMMAND</h1>
        <div class="sub">Sector 9 • Deep Orbit</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SpaceRoom } from '../../src/environments/SpaceRoom.js'; // Re-using existing environment logic
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';

        // 1. Init
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.5, 4] });
        env.init();
        env.scene.background = new THREE.Color(0x020205);

        // 2. Space Environment
        // We can simulate what SpaceRoom does or use it if adaptable.
        // Let's manually create a nice starfield to be sure compatible with SpatialEnv structure
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const posArray = new Float32Array(starsCount * 3);
        const colArray = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
            posArray[i * 3] = (Math.random() - 0.5) * 100;
            posArray[i * 3 + 1] = (Math.random() - 0.5) * 100;
            posArray[i * 3 + 2] = (Math.random() - 0.5) * 100;

            const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.8, 0.8);
            colArray[i * 3] = c.r; colArray[i * 3 + 1] = c.g; colArray[i * 3 + 2] = c.b;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
            size: 0.15, vertexColors: true, transparent: true, opacity: 0.8
        }));
        env.scene.add(stars);

        // Rotating Loop
        env.updatables.push({
            update: (d) => {
                stars.rotation.y += d * 0.05;
            }
        });


        // 3. AI: Semantic Ghost (AURORA)
        const ghost = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(ghost);
        env.updatables.push(ghost);

        setTimeout(() => {
            ghost.updatePanelText("AURORA SYSTEM ONLINE");
            ghost.guideTo(statusHub.group, "Monitoring Station Stats");
        }, 1000);


        // 4. UI SECTORS

        // A. STATUS HUB (Center) - HaloCard
        const statusHub = new MagneticCard3D(env.scene, env.camera, [0, 1.5, -2], {
            width: 3, height: 2, color: 0x001133, cornerRadius: 0.2
        });
        env.add(statusHub.group);
        env.updatables.push(statusHub);

        // Charts on the Hub
        const powerChart = new Chart3D(env.scene, env.camera, [0, 0, 0], {
            width: 2.5, height: 1.5, chartType: 'line',
            data: {
                labels: ['A', 'B', 'C', 'D', 'E'],
                datasets: [{
                    label: 'Reactor Output',
                    data: [80, 85, 82, 90, 88],
                    borderColor: '#00ffff',
                    backgroundColor: 'rgba(0, 255, 255, 0.1)'
                }]
            }
        });
        // Attach chart to card content group manually or just position in front
        // MagneticCard contentGroup is offset z=0.03
        statusHub.addContent(powerChart.group);
        // Note: Chart3D might need updates. Let's register it.
        env.updatables.push(powerChart);


        // B. LEFT WING: SHIELDS & DEFENSE
        const leftPanel = new THREE.Group();
        leftPanel.position.set(-3.5, 1.5, -1.5);
        leftPanel.rotation.y = 0.3;
        env.scene.add(leftPanel);

        const shieldToggle = new Toggle3D(env.scene, env.camera, [0, 0, 0], {
            label: "DEFLECTOR SHIELDS", width: 2.5, isOn: true, onColor: 0x00ff00
        });
        leftPanel.add(shieldToggle.group); // Watch out for raycasting offset issues if nested deeply without world matrix updat
        // Ideally add to env directly but position carefully.
        // Let's stick to env.add for reliability of controls
        shieldToggle.group.position.set(-3.5, 2.0, -1.5);
        shieldToggle.group.rotation.y = 0.3;
        env.add(shieldToggle.group);
        env.updatables.push(shieldToggle);

        const shieldSlider = new Slider3D(env.scene, env.camera, [-3.5, 1.2, -1.5], {
            label: "SHIELD POWER", width: 2.5, value: 0.65, color: 0x4488ff,
            onChange: (c, v) => {
                // Update ghost
                ghost.updatePanelText(`SHIELDS: ${Math.round(v * 100)}%`);
            }
        });
        shieldSlider.group.rotation.y = 0.3;
        env.add(shieldSlider.group);
        env.updatables.push(shieldSlider);


        // C. RIGHT WING: LIFE SUPPORT
        const lifeToggle = new Toggle3D(env.scene, env.camera, [3.5, 2.0, -1.5], {
            label: "OXYGEN RECYCLER", width: 2.5, isOn: true, onColor: 0x00ff00
        });
        lifeToggle.group.rotation.y = -0.3;
        env.add(lifeToggle.group);
        env.updatables.push(lifeToggle);

        const emergencyBtn = new Button3D(env.scene, env.camera, [3.5, 1.2, -1.5], {
            label: "EMERGENCY VENT", width: 2.5, color: 0xff0000,
            onClick: () => {
                triggerAlarm();
            }
        });
        emergencyBtn.group.rotation.y = -0.3;
        env.add(emergencyBtn.group);
        env.updatables.push(emergencyBtn);


        // 5. ALERT SYSTEM (Volumetric Popup)
        const alertCard = new VolumetricCard3D(env.scene, env.camera, [0, 1.5, -1], {
            width: 2, height: 1, baseColor: 0xff0000, popScale: 0.5
        });
        alertCard.group.visible = false;
        env.add(alertCard.group);
        env.updatables.push(alertCard);

        // Add text to alert
        // Simple HTML canvas texture on it?
        // Or Semantic Ghost handles the alert.

        function triggerAlarm() {
            alertCard.group.visible = !alertCard.group.visible;
            if (alertCard.group.visible) {
                ghost.updatePanelText("WARNING: VENTING");
                env.scene.background = new THREE.Color(0x220000); // Red alert bg
            } else {
                ghost.updatePanelText("SYSTEM NORMAL");
                env.scene.background = new THREE.Color(0x020205);
            }
        }


        // 6. Start
        env.start();

    </script>
</body>

</html>
