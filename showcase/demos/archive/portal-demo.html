<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial UI - Portal Window Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        p {
            margin: 5px 0 0 0;
            opacity: 0.7;
            font-size: 14px;
        }

        .key {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-size: 12px;
            margin: 0 2px;
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>Portal Window</h1>
        <p>A window into another dimension using Stencil Buffers.</p>
        <p>Use <span class="key">WASD</span> to move, <span class="key">Mouse</span> to look.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialControls } from '../../../src/controls/SpatialControls.js';
        import { StarfieldBackground } from '../../../src/environments/StarfieldBackground.js';
        import { PortalWindow } from '../../../src/components/PortalWindow.js';

        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new SpatialControls(camera, renderer.domElement, scene);

        // Environment
        const starfield = new StarfieldBackground(scene);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // --- Portal Setup ---

        // 1. Create the Portal Window
        const portal = new PortalWindow(3, 2); // 3m wide, 2m high
        portal.position.set(0, 1.6, 0); // Eye level
        scene.add(portal);
        portal.addBorder(0.1, 0x00ffff); // Cyan frame

        // 2. Add content INSIDE the portal
        const geometry = new THREE.TorusKnotGeometry(0.6, 0.2, 100, 16);
        const material = new THREE.MeshStandardMaterial({
            color: 0xff3366,
            roughness: 0.1,
            metalness: 0.8
        });
        const torus = new THREE.Mesh(geometry, material);

        // We modify the material inside addContent to respect the stencil
        portal.addContent(torus);

        // Add a rotating cube inside too
        const boxGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0xffee00 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(1, 0.5, -0.5);
        portal.addContent(box);

        // Add something "behind" the portal in the real world to prove transparency/masking
        // This object should be visible AROUND the portal, but blocked BY the portal's content?
        // Actually, the portal pane is transparent (colorWrite: false). 
        // So regular objects behind it WILL be visible unless the portal content occludes them.
        const pillar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 4),
            new THREE.MeshStandardMaterial({ color: 0x444444 })
        );
        pillar.position.set(0, 2, -2);
        scene.add(pillar);


        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update(delta);
            starfield.update(time);

            // Animate Portal Contents
            torus.rotation.x = time * 0.5;
            torus.rotation.y = time * 0.8;

            box.rotation.z = time;
            box.position.y = Math.sin(time) * 0.5;

            renderer.render(scene, camera);
        }

        animate();

        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
