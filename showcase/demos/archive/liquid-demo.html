<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial UI - Liquid UI Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        p {
            margin: 5px 0 0 0;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>Liquid UI Metamorphism</h1>
        <p>Gooey fusion effect using metaball thresholding.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialControls } from '../../../src/controls/SpatialControls.js';
        import { StarfieldBackground } from '../../../src/environments/StarfieldBackground.js';
        import { LiquidContainer } from '../../../src/components/LiquidContainer.js';

        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Environment
        const starfield = new StarfieldBackground(scene);

        // Lighting (for standard objects)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(2, 2, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));

        // --- Liquid UI Setup ---

        // 1. Create Container
        const liquidUI = new LiquidContainer(6, 6, renderer);
        liquidUI.position.set(0, 0, 0);
        scene.add(liquidUI);

        // 2. Add blobs (Spheres work best for metaballs)
        const blobGeo = new THREE.SphereGeometry(0.3, 32, 32);

        // We use a bright emissive color effectively for the "Flat" metaball look
        // Standard shading might look weird after thresholding, flat is safer for 2D UI style
        const blobMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });

        const blob1 = new THREE.Mesh(blobGeo, blobMat);
        const blob2 = new THREE.Mesh(blobGeo, blobMat);
        const blob3 = new THREE.Mesh(blobGeo, blobMat);

        liquidUI.addContent(blob1);
        liquidUI.addContent(blob2);
        liquidUI.addContent(blob3);

        // Add a "Button" rectangle too
        const btnGeo = new THREE.BoxGeometry(1.5, 0.5, 0.1);
        const btnMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 }); // Same color fuses better
        const button = new THREE.Mesh(btnGeo, btnMat);
        button.position.y = -1;
        liquidUI.addContent(button);


        // Controls
        const controls = new SpatialControls(camera, renderer.domElement, scene);

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Animate Blobs
            blob1.position.x = Math.sin(time) * 1.0;
            blob1.position.y = Math.cos(time * 1.3) * 1.0;

            blob2.position.x = Math.sin(time * 0.8 + 2) * 1.2;
            blob2.position.y = Math.cos(time * 0.5 + 1) * 0.8;

            blob3.position.x = Math.cos(time * 2) * 0.5;
            blob3.position.y = Math.sin(time * 2) * 0.5;

            controls.update(delta);
            starfield.update(time);

            // IMPORTANT: Update Liquid UI before main render
            liquidUI.update(camera);

            renderer.render(scene, camera);
        }

        animate();

        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
