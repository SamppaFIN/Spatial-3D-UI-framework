<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenaario 1: The Curator’s Desk</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* Cosmic Theme Global Overrides */
        .spatial-text-display,
        .spatial-modal-content {
            background: linear-gradient(135deg, #050510 0%, #1a1a2e 100%) !important;
            color: #ffffff !important;
            border: 1px solid #4ecdc4 !important;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.2) !important;
            font-family: 'Inter', sans-serif !important;
            border-radius: 16px !important;
            padding: 30px !important;
            /* increased padding */
        }

        /* Typography */
        .spatial-text-display h1,
        .spatial-modal-content h2 {
            color: #4ecdc4 !important;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.6);
            margin-top: 0;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .spatial-text-display h3 {
            color: #ff6b6b !important;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .spatial-text-display ul {
            padding-left: 20px;
            color: #e0e0e0;
        }

        .spatial-text-display li {
            margin-bottom: 8px;
        }

        /* Hide scrollbars but allow scrolling if absolutely needed */
        .spatial-text-display::-webkit-scrollbar,
        .spatial-modal-content::-webkit-scrollbar {
            width: 4px;
        }

        .spatial-text-display::-webkit-scrollbar-thumb,
        .spatial-modal-content::-webkit-scrollbar-thumb {
            background: #4ecdc4;
            border-radius: 2px;
        }

        .spatial-text-display::-webkit-scrollbar-track,
        .spatial-modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Modal specific */
        .spatial-modal-content button {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .spatial-modal-content button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #88aaff;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        p {
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>THE CURATOR'S DESK</h1>
        <p>Precision Workstation • Magnetic Cards • Kinetic Core</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';

        // Components
        import { KineticSculpture3D } from '../../src/controls/KineticSculpture3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Accordion3D } from '../../src/controls/Accordion3D.js';
        import { Modal3D } from '../../src/controls/Modal3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { TextDisplay3D } from '../../src/controls/TextDisplay3D.js';
        import { SpatialScrubber3D } from '../../src/controls/SpatialScrubber3D.js';
        import { getHTMLOverlay } from '../../src/utils/HTMLOverlay.js';

        // 1. Initialize Environment
        const env = new SpatialEnvironment();
        env.init();

        // 2. Enhanced Camera Controls
        const controls = new OrbitControls(env.camera, env.renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 12;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going below ground
        controls.enablePan = false;

        // Remove default controls from env loop if present, we manage updates
        // Note: SpatialEnvironment might have its own controls, usually we override or coexist.
        // If env has controls, disable them or replace usage.
        // env.controls = controls; // Assuming env supports this, or we just update in loop.

        // Lighting Refinement
        const deskLight = new THREE.SpotLight(0xffeedd, 10);
        deskLight.position.set(0, 5, 2);
        deskLight.target.position.set(0, 0, -2);
        deskLight.angle = Math.PI / 4;
        deskLight.penumbra = 0.5;
        env.scene.add(deskLight);
        env.scene.add(deskLight.target);

        // ============================================
        // SCENARIO: THE CURATOR'S DESK
        // ============================================

        const appState = {
            showTools: true,
            showInfo: true,
            isMobile: false
        };

        // Groups for organized layout
        const leftGroup = new THREE.Group();
        const rightGroup = new THREE.Group();
        const centerGroup = new THREE.Group();
        env.scene.add(leftGroup);
        env.scene.add(rightGroup);
        env.scene.add(centerGroup);

        // A. KINETIC SCULPTURE (Brain/Core)
        const kineticCore = new KineticSculpture3D(env.scene, env.camera, [0, 1.5, -4], {
            radius: 0.8,
            particleCount: 250,
            color: 0x00ffff,
            speed: 0.2
        });
        env.add(kineticCore.group);
        env.updatables.push(kineticCore);

        // B. LEFT WING (Tools)
        const leftCard = new MagneticCard3D(env.scene, env.camera, [0, 0, 0], {
            width: 0.8,
            height: 0.6,
            content: "TOOLS",
            color: 0x1a2b3c, // Darker blue-grey
            renderer: env.renderer
        });
        // We add card to local group instead of directly to scene so we can move the group comfortably
        leftGroup.add(leftCard.group);
        // We still need to push to updatabes for internal logic (hover etc if any)
        env.updatables.push(leftCard);

        const accordion = new Accordion3D(env.scene, env.camera, [-1.6, 0, 0], {
            width: 2.2,
            contentHeight: 3.5,
            items: [
                { title: 'Geometry', content: '### 📐 Mesh Data\n* **Vertices**: 12k\n* **Faces**: 10k' },
                { title: 'Materials', content: '### 🎨 Channels\n* Albedo: 2K\n* Normal: Tangent' },
                { title: 'Modifiers', content: '### ⚙️ Stack\n1. [x] Mirror\n2. [x] Array' }
            ],
            color: 0x1a2b3c,
            renderer: env.renderer
        });
        leftGroup.add(accordion.group);
        env.updatables.push(accordion);

        // C. RIGHT WING (Info)
        const rightCard = new MagneticCard3D(env.scene, env.camera, [0, 0, 0], {
            width: 0.8,
            height: 0.6,
            content: "INFO",
            color: 0x1a2b3c,
            renderer: env.renderer
        });
        rightGroup.add(rightCard.group);
        env.updatables.push(rightCard);

        const infoBoard = new TextDisplay3D(env.scene, env.camera, [1.8, 0, 0], {
            width: 3.0,
            height: 3.5,
            content: `
# 🌌 Curator's Desk

Interactive 3D workspace demo.

### 🎮 Controls
* **Rotate**: Left Click / Touch Drag
* **Pan**: Right Click / Two Finger Drag
* **Zoom**: Scroll / Pinch

### 📱 Layout
Automatically adapts to device orientation.
            `,
            backgroundColor: 0x0a0a16,
            borderColor: 0x4ecdc4
        });
        rightGroup.add(infoBoard.group);
        env.updatables.push(infoBoard);

        // Scrollbar
        const scrollbarCurve = new THREE.LineCurve3(new THREE.Vector3(0, 0.75, 0), new THREE.Vector3(0, -0.75, 0));
        const scrollbar = new SpatialScrubber3D(env.scene, env.camera, [3.5, 0, 0], {
            trackCurve: scrollbarCurve,
            trackRadius: 0.03,
            handleRadius: 0.08,
            color: 0x4ecdc4,
            duration: 1,
            onScrub: (val) => {
                const htmlOverlay = getHTMLOverlay();
                const overlayObj = htmlOverlay.objects.get(`textdisplay_${infoBoard.controlId}`);
                if (overlayObj && overlayObj.element) {
                    overlayObj.element.scrollTop = val * (overlayObj.element.scrollHeight - overlayObj.element.clientHeight);
                }
            }
        });
        rightGroup.add(scrollbar.group);
        env.updatables.push(scrollbar);

        // D. CENTER WING (Action)
        const centerCard = new MagneticCard3D(env.scene, env.camera, [0, 0, 0], {
            width: 1.2,
            height: 0.5,
            content: "ACTIONS",
            color: 0x222222,
            renderer: env.renderer
        });
        centerGroup.add(centerCard.group);
        env.updatables.push(centerCard);

        const exportBtn = new Button3D(env.scene, env.camera, [0, 0, 0.1], {
            label: "EXPORT PROJECT",
            color: 0xff4444,
            width: 0.9,
            height: 0.2,
            onClick: () => exportModal.open()
        });
        // Parenting button to card group for easier movement
        centerCard.group.add(exportBtn.group); // Note: Button3D adds to scene by default, so we might need to remove/re-add or just position absolutely
        // Actually Button3D adds to scene in constructor usually? Checking implementation... usually it just creates a group. 
        // We'll trust the absolute positioning for now via the updateLayout.
        env.updatables.push(exportBtn);

        // E. MODALS
        const exportModal = new Modal3D(env.scene, env.camera, [0, 1.5, -1], {
            title: "SYSTEM EXPORT",
            width: 6,
            height: 4,
            isOpen: false,
            content: "Exporting...",
            htmlContent: `<div style="text-align:center; color: #4ecdc4;"><h2>Ready to Transmit</h2><button onclick="startExport(this, '.GLB')" style="padding:15px; margin:10px; background:#4ecdc4; border:none; cursor:pointer;">DOWNLOAD .GLB</button></div>`
        });
        env.add(exportModal.group);
        env.updatables.push(exportModal);


        // ============================================
        // LAYOUT ENGINE
        // ============================================

        function updateLayout() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const aspect = width / height;
            appState.isMobile = width < 768;

            if (appState.isMobile) {
                // === MOBILE STACK LAYOUT ===
                // Vertical arrangement

                // Center (Action) - Top/Front
                centerGroup.position.set(0, -1.0, -2);
                centerGroup.rotation.set(-Math.PI / 4, 0, 0);
                centerGroup.scale.setScalar(0.8);

                // Left (Tools) - Middle
                leftGroup.position.set(0, 0.5, -3);
                leftGroup.rotation.set(0, 0, 0);
                leftCard.group.position.set(0, 0, 0);
                accordion.group.position.set(0, 0.8, -0.2); // Above the card
                accordion.group.rotation.set(0, 0, 0);

                // Right (Info) - Bottom/Back or accessible via scroll? 
                // Let's put it on top actually
                rightGroup.position.set(0, 2.5, -4);
                rightGroup.rotation.set(0, 0, 0);
                rightCard.group.position.set(0, 0, 0);
                infoBoard.group.position.set(0, 0.8, -0.2);

                // Adjust camera default for mobile
                controls.minDistance = 5;

            } else {
                // === DESKTOP SURROUND LAYOUT ===

                // Center
                centerGroup.position.set(0, 0.4, -1.5);
                centerGroup.rotation.set(-Math.PI / 6, 0, 0);
                centerGroup.scale.setScalar(1);

                // Left Wing
                leftGroup.position.set(-2.5, 0.8, -1.0);
                leftGroup.rotation.set(-Math.PI / 10, Math.PI / 6, 0); // Tilted in

                leftCard.group.position.set(0, 0, 0);
                accordion.group.position.set(-1.4, 0.2, 0); // To the left of card
                accordion.group.rotation.set(0, Math.PI / 8, 0);

                // Right Wing
                rightGroup.position.set(2.5, 0.8, -1.0);
                rightGroup.rotation.set(-Math.PI / 10, -Math.PI / 6, 0); // Tilted in

                rightCard.group.position.set(0, 0, 0);
                infoBoard.group.position.set(2.4, 0.2, 0); // To the right of card
                infoBoard.group.rotation.set(0, -Math.PI / 8, 0);
                scrollbar.group.position.set(4, 0.2, 0.2);
            }
        }

        window.addEventListener('resize', () => {
            env.onWindowResize();
            updateLayout();
        });
        updateLayout(); // Initial call

        // ============================================
        // INTERACTION
        // ============================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleInteraction(event) {
            let cx, cy;
            if (event.targetTouches && event.targetTouches.length > 0) {
                cx = event.targetTouches[0].clientX;
                cy = event.targetTouches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                cx = event.changedTouches[0].clientX;
                cy = event.changedTouches[0].clientY;
            } else {
                cx = event.clientX;
                cy = event.clientY;
            }

            mouse.x = (cx / window.innerWidth) * 2 - 1;
            mouse.y = -(cy / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, env.camera);

            // Interaction Checks...
            // Note: Simplification for demo. Real app should use a central interaction manager.
            const objects = [leftCard.group, rightCard.group, centerCard.group];

            // Allow clicking through groups to find the meshes
            const intersects = raycaster.intersectObjects(env.scene.children, true);

            if (intersects.length > 0) {
                // Find parent group that matters
                let target = intersects[0].object;
                while (target.parent && target.parent !== env.scene) {
                    if (target === leftCard.cardMesh) { // Check specific meshes if available, or logic
                        appState.showTools = !appState.showTools;
                        animateToggle(accordion.group, appState.showTools);
                        return;
                    }
                    if (target === rightCard.cardMesh) {
                        appState.showInfo = !appState.showInfo;
                        animateToggle(infoBoard.group, appState.showInfo);
                        animateToggle(scrollbar.group, appState.showInfo);
                        return;
                    }
                    target = target.parent;
                }
            }
        }

        window.addEventListener('click', handleInteraction);
        // window.addEventListener('touchstart', handleInteraction); // OrbitControls usually handles touch, prevents click? use 'click' which triggers on tap too usually.

        // Hover Effect using MouseMove
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            // logic moved to animation loop for smoother raycasting or here?
            // Heavy raycasting on mousemove can be expensive. Let's do it in update loop.
        });

        function animateToggle(group, show) {
            // ... existing toggle logic ...
            const target = show ? 1 : 0;
            // Simple tween
            new TWEEN.Tween(group.scale)
                .to({ x: target, y: target, z: target }, 400)
                .easing(TWEEN.Easing.Back.Out)
                .start();
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================

        // Hook into internal loop or use TWEEN.update
        // Adding custom update to env.updatables
        env.updatables.push({
            update: (time) => {
                controls.update(); // Damping
                TWEEN.update(); // Animations

                // Breathing animation for cards
                const breath = Math.sin(time * 2) * 0.002;
                leftCard.group.position.y += breath;
                rightCard.group.position.y += breath;
                centerCard.group.position.y += breath;

                // Hover Raycast (Optional, perform every N frames for perf)
                raycaster.setFromCamera(mouse, env.camera);
                const intersects = raycaster.intersectObjects([leftCard.cardMesh, rightCard.cardMesh, centerCard.cardMesh].filter(Boolean));

                [leftCard, rightCard, centerCard].forEach(c => {
                    if (c.cardMesh) c.cardMesh.material.emissive.setHex(0x000000);
                });

                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    obj.material.emissive.setHex(0x224466);
                }
            }
        });

        // Global export handler
        window.startExport = (btn, format) => {
            // ... existing export logic ...
            setTimeout(() => { btn.innerHTML = "✅ SENT"; btn.style.background = "#4ecdc4"; }, 1500);
        };

        // 3. Start
        env.start();

    </script>
</body>

</html>
