<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenaario 1: The Curator’s Desk</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #88aaff;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        p {
            margin-top: 5px;
            opacity: 0.7;
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>THE CURATOR'S DESK</h1>
        <p>Precision Workstation • Magnetic Cards • Kinetic Core</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';

        // Components
        import { KineticSculpture3D } from '../../src/controls/KineticSculpture3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { Accordion3D } from '../../src/controls/Accordion3D.js';
        import { Modal3D } from '../../src/controls/Modal3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { TextDisplay3D } from '../../src/controls/TextDisplay3D.js';

        // 1. Initialize Environment
        const env = new SpatialEnvironment();
        env.init();

        // Lighting Refinement for "Workstation" feel
        // Add a focused desk lamp feel
        const deskLight = new THREE.SpotLight(0xffeedd, 5);
        deskLight.position.set(0, 3, 0.5);
        deskLight.target.position.set(0, 0, -0.8);
        deskLight.angle = Math.PI / 4;
        deskLight.penumbra = 0.5;
        env.scene.add(deskLight);
        env.scene.add(deskLight.target);

        // ============================================
        // SCENARIO 1: THE CURATOR'S DESK
        // ============================================

        // A. KINETIC SCULPTURE (The "Brain/Core")
        // Moved back to create depth - acting as a distant focal point
        const kineticCore = new KineticSculpture3D(env.scene, env.camera, [0, 1.2, -2.5], {
            radius: 0.6, // Larger since it's further away
            particleCount: 200,
            color: 0x00ffff,
            speed: 0.3
        });
        env.add(kineticCore.group);
        env.updatables.push(kineticCore);

        // B. MAGNETIC CARDS (The "Workspace")
        // Arranged in a semicircle around the user

        // 1. Left Card: Tools & Navigation
        // 1. Left Card: Tools & Navigation
        // Moved Left to widen the workspace
        // 1. Left Card: Tools & Navigation
        // Widened significantly to prevent overlap
        // 1. Left Card: Tools & Navigation
        // Widened significantly to prevent overlap
        const leftCard = new MagneticCard3D(env.scene, env.camera, [-1.8, 0.9, -0.6], {
            width: 0.8,
            height: 0.6,
            content: "TOOLS",
            color: 0x334455,
            renderer: env.renderer // Pass renderer for precise raycasting
        });
        leftCard.group.rotation.y = Math.PI / 6; // Angled inward
        leftCard.group.rotation.x = -Math.PI / 6; // Angled upward (desk slope)
        env.add(leftCard.group);
        env.updatables.push(leftCard);

        // Attach Accordion Menu to Left Card
        // Adjusted X position to match new Left Card
        // Attach Accordion Menu to Left Card
        // Adjusted X position and INCREASED WIDTH
        // Attach Accordion Menu to Left Card
        // Adjusted X position and INCREASED WIDTH
        const accordion = new Accordion3D(env.scene, env.camera, [-2.65, 0.9, -0.5], {
            width: 1.5, // Widen to 1.5 as requested
            renderer: env.renderer, // Ensure it has renderer too if needed
            items: [
                {
                    title: 'Geometry',
                    content: `
### Mesh Data
*   **Vertices**: 12,404
*   **Faces**: 10,200
*   **Topology**: <span style="color: #4ecdc4">Quad-based</span>

### Operations
*   🔨 [**Subdivide**](#subdivide)
*   🧼 [**Smooth**](#smooth)
*   ✂️ [**Boolean**](#boolean)
`
                },
                {
                    title: 'Materials',
                    content: `
### Active Channels
<div style="display: flex; gap: 10px; margin-bottom: 10px;">
  <div style="width: 30px; height: 30px; background: #ff4444; border-radius: 50%;"></div>
  <div style="width: 30px; height: 30px; background: #4ecdc4; border-radius: 50%;"></div>
  <div style="width: 30px; height: 30px; background: #ffee00; border-radius: 50%;"></div>
</div>

*   **Roughness**: 0.45
*   **Metalness**: 0.80
*   **Shader**: PBR Standard
`
                },
                {
                    title: 'Modifiers',
                    content: `
### Stack
1.  **Mirror** (X-Axis)
2.  **Array** (Count: 5)
3.  **Curve** (BezierCircle)

<div style="background: rgba(255,255,255,0.1); padding: 5px; border-radius: 4px; margin-top: 10px; text-align: center;">
  <em>Auto-Update On</em>
</div>
`
                }
            ],
            color: 0x223344,
            width: 1.5, // Maintain width
            renderer: env.renderer
        });
        accordion.group.rotation.y = Math.PI / 4; // Steeper angle to face user
        env.add(accordion.group);
        env.updatables.push(accordion);


        // 2. Right Card: Settings & Toggles
        // 2. Right Card: Settings & Toggles
        // Moved Right to widen the workspace
        // 2. Right Card: Settings & Toggles
        // Widened significantly
        // 2. Right Card: Settings & Toggles
        // Widened significantly
        // 2. Right Card: Project Info & Stats
        const rightCard = new MagneticCard3D(env.scene, env.camera, [1.8, 0.9, -0.6], {
            width: 0.8,
            height: 0.6,
            content: "INFO",
            color: 0x334455,
            renderer: env.renderer
        });
        rightCard.group.rotation.y = -Math.PI / 6; // Angled inward
        rightCard.group.rotation.x = -Math.PI / 6; // Desk slope
        env.add(rightCard.group);
        env.updatables.push(rightCard);

        // Info Board attached to Right Card
        // Highlighting features of the demo
        const infoBoard = new TextDisplay3D(env.scene, env.camera, [2.5, 0.9, -0.5], {
            width: 1.2,
            height: 0.8,
            content: `
# 🛠️ Demo Controls

*   **LMB Drag**: Rotate View
*   **RMB Drag**: Pan View
*   **Scroll**: Zoom
*   **Left Panel**: Tools (Accordion)
*   **Center**: Actions (Export)

*This environment showcases the "Curator" layout style.*
            `,
            backgroundColor: 0x223344,
            borderColor: 0x4ecdc4
        });

        // Match rotation of right card mostly, but face user
        infoBoard.group.rotation.y = -Math.PI / 4;
        env.add(infoBoard.group);
        env.updatables.push(infoBoard);


        // 3. Main Center Card (Directly below kinetic core)
        // Used for main actions like "Export"
        const centerCard = new MagneticCard3D(env.scene, env.camera, [0, 0.45, -0.7], {
            width: 1.0,
            height: 0.4,
            content: "MAIN_ACTION",
            color: 0x222222,
            renderer: env.renderer
        });
        centerCard.group.rotation.x = -Math.PI / 4; // Steeper angle
        env.add(centerCard.group);
        env.updatables.push(centerCard);

        // "Export" Button on Center Card
        const exportBtn = new Button3D(env.scene, env.camera, [0, 0.45, -0.68], {
            text: "EXPORT PROJECT",
            color: 0xff4444,
            width: 0.8,
            height: 0.15,
            padding: 0.05,
            onClick: () => {
                exportModal.open();
            }
        });
        exportBtn.group.rotation.x = -Math.PI / 4;
        env.add(exportBtn.group);
        env.updatables.push(exportBtn);


        // C. DIALOG (Hidden initially)
        // Positioned slightly higher so it doesn't clip with the center card instructions
        const exportModal = new Modal3D(env.scene, env.camera, [0, 1.6, -1.0], {
            title: "Export Project",
            width: 3,
            height: 2,
            isOpen: false,
            htmlContent: `
                <div style="text-align: center; color: white;">
                    <h2>Ready to Export?</h2>
                    <p>Select format:</p>
                    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                        <button style="padding: 10px 20px; background: #4ecdc4; border: none; font-weight: bold; cursor: pointer;">.GLB</button>
                        <button style="padding: 10px 20px; background: #ff6b6b; border: none; font-weight: bold; cursor: pointer;">.USDZ</button>
                    </div>
                </div>
            `
        });
        env.add(exportModal);
        // NOTE: Modal3D update handles rendering loop if it has one.
        env.updatables.push(exportModal);


        // 3. Start Loop
        env.start();
    </script>
</body>

</html>
