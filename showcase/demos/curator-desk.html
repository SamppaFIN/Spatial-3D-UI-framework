<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skenaario 1: The Curator’s Desk</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        /* Cosmic Theme Global Overrides */
        .spatial-text-display,
        .spatial-modal-content {
            background: linear-gradient(135deg, #050510 0%, #1a1a2e 100%) !important;
            color: #ffffff !important;
            border: 1px solid #4ecdc4 !important;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.2) !important;
            font-family: 'Inter', sans-serif !important;
            border-radius: 16px !important;
            padding: 30px !important;
            /* increased padding */
        }

        /* Typography */
        .spatial-text-display h1,
        .spatial-modal-content h2 {
            color: #4ecdc4 !important;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.6);
            margin-top: 0;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .spatial-text-display h3 {
            color: #ff6b6b !important;
            margin-top: 20px;
            font-size: 1.2rem;
        }

        .spatial-text-display ul {
            padding-left: 20px;
            color: #e0e0e0;
        }

        .spatial-text-display li {
            margin-bottom: 8px;
        }

        /* Hide scrollbars but allow scrolling if absolutely needed */
        .spatial-text-display::-webkit-scrollbar,
        .spatial-modal-content::-webkit-scrollbar {
            width: 4px;
        }

        .spatial-text-display::-webkit-scrollbar-thumb,
        .spatial-modal-content::-webkit-scrollbar-thumb {
            background: #4ecdc4;
            border-radius: 2px;
        }

        .spatial-text-display::-webkit-scrollbar-track,
        .spatial-modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Modal specific */
        .spatial-modal-content button {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .spatial-modal-content button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #88aaff;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        p {
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>THE CURATOR'S DESK</h1>
        <p>Precision Workstation • Magnetic Cards • Kinetic Core</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';

        // Components
        import { KineticSculpture3D } from '../../src/controls/KineticSculpture3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { Accordion3D } from '../../src/controls/Accordion3D.js';
        import { Modal3D } from '../../src/controls/Modal3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { TextDisplay3D } from '../../src/controls/TextDisplay3D.js';
        import { SpatialScrubber3D } from '../../src/controls/SpatialScrubber3D.js';
        import { getHTMLOverlay } from '../../src/utils/HTMLOverlay.js';

        // 1. Initialize Environment
        const env = new SpatialEnvironment();
        env.init();

        // Lighting Refinement for "Workstation" feel
        // Add a focused desk lamp feel
        const deskLight = new THREE.SpotLight(0xffeedd, 5);
        deskLight.position.set(0, 3, 0.5);
        deskLight.target.position.set(0, 0, -0.8);
        deskLight.angle = Math.PI / 4;
        deskLight.penumbra = 0.5;
        env.scene.add(deskLight);
        env.scene.add(deskLight.target);

        // ============================================
        // SCENARIO 1: THE CURATOR'S DESK
        // ============================================

        // A. KINETIC SCULPTURE (The "Brain/Core")
        // Moved back to create depth - acting as a distant focal point
        const kineticCore = new KineticSculpture3D(env.scene, env.camera, [0, 1.2, -2.5], {
            radius: 0.6, // Larger since it's further away
            particleCount: 200,
            color: 0x00ffff,
            speed: 0.3
        });
        env.add(kineticCore.group);
        env.updatables.push(kineticCore);

        // B. MAGNETIC CARDS (The "Workspace")
        // Arranged in a semicircle around the user

        // State for toggles
        const appState = {
            showTools: true,
            showInfo: true
        };

        // 1. Left Card: Tools & Navigation Button
        const leftCard = new MagneticCard3D(env.scene, env.camera, [-2.2, 0.9, -0.6], {
            width: 0.8,
            height: 0.6,
            content: "TOOLS",
            color: 0x334455,
            renderer: env.renderer,
            // Simple click logic via MagneticCard's internal or manual raycast
        });
        leftCard.group.rotation.y = Math.PI / 6; // Angled inward
        leftCard.group.rotation.x = -Math.PI / 6; // Angled upward (desk slope)
        env.add(leftCard.group);
        env.updatables.push(leftCard);

        // Attach Accordion Menu to Left Card (Initially collapsed/hidden)
        // Positioned further left to avoid overlap and use Markdown
        const accordion = new Accordion3D(env.scene, env.camera, [-3.8, 0.9, -0.5], {
            width: 2.2, // Wider for better readability
            contentHeight: 3.5, // Taller content
            renderer: env.renderer,
            items: [
                {
                    title: 'Geometry',
                    content: `
### 📐 Mesh Data
*   **Vertices**: 12,404
*   **Faces**: 10,200
*   **Topology**: **Quad-based**

### 🛠️ Operations
1.  **Subdivide**: Increase resolution
2.  **Smooth**: Soften normals
3.  **Boolean**: Union/Intersect
`
                },
                {
                    title: 'Materials',
                    content: `
### 🎨 Active Channels
*   🔴 **Albedo**: 2K Texture
*   🔵 **Normal**: Tangent Space
*   ✨ **Roughness**: 0.45

> *Shader compiled successfully.*
`
                },
                {
                    title: 'Modifiers',
                    content: `
### ⚙️ Stack
1.  [x] **Mirror** (X-Axis)
2.  [x] **Array** (Count: 5)
3.  [ ] **Curve** (BezierCircle)

_Double-click modifier to edit properties._
`
                }
            ],
            color: 0x223344,
            renderer: env.renderer
        });
        accordion.group.rotation.y = Math.PI / 4; // Steeper angle to face user
        accordion.group.scale.set(1, 1, 1); // Initially visible
        env.add(accordion.group);
        env.updatables.push(accordion);


        // 2. Right Card: Settings & Toggles Button
        const rightCard = new MagneticCard3D(env.scene, env.camera, [1.8, 0.9, -0.6], {
            width: 0.8,
            height: 0.6,
            content: "INFO",
            color: 0x334455,
            renderer: env.renderer
        });
        rightCard.group.rotation.y = -Math.PI / 6; // Angled inward
        rightCard.group.rotation.x = -Math.PI / 6; // Desk slope
        env.add(rightCard.group);
        env.updatables.push(rightCard);

        // Info Board attached to Right Card
        // Positioned far right to avoid overlapping with Magnetic Card [1.8]
        const infoBoard = new TextDisplay3D(env.scene, env.camera, [5.5, 1.2, -0.5], {
            width: 4.5,
            height: 3.5,
            content: `
# 👋 Tervetuloa Avaruuteen!

Tämä on **Curator's Desk** -työtila. Tässä lyhyt opas:

### 🎮 Ohjaimet
*   🖱️ **Vasen Hiiri**: Kierrä näkymää
*   🖱️ **Oikea Hiiri**: Liikuta kameraa sivusuunnassa
*   📜 **Rulla**: Zoomaa lähemmäs/kauemmas

### 🎛️ Paneelit
1.  **TOOLS (Vasen)**: Työkalut ja geometriatiedot.
2.  **INFO (Oikea)**: Tämä ohjeruutu.
3.  **EXPORT (Keskellä)**: Vie projekti tiedostona.

> *Käytä vasemmalla ja oikealla olevia kelluvia kortteja avataksesi tai sulkeaksesi paneeleita.*

---
**Status**: 🟢 Järjestelmä Valmis
            `,
            backgroundColor: 0x1a1a2e,
            borderColor: 0x4ecdc4
        });

        infoBoard.group.rotation.y = -Math.PI / 4;
        infoBoard.group.scale.set(1, 1, 1);
        env.add(infoBoard.group);
        env.updatables.push(infoBoard);

        // Scrollbar for Info Board
        const scrollbarCurve = new THREE.LineCurve3(
            new THREE.Vector3(0, 0.75, 0),
            new THREE.Vector3(0, -0.75, 0)
        );

        const scrollbar = new SpatialScrubber3D(env.scene, env.camera, [7.8, 1.2, -0.1], {
            trackCurve: scrollbarCurve,
            trackRadius: 0.03,
            handleRadius: 0.08,
            color: 0x88ccff,
            duration: 1, // Normalized 0-1
            onScrub: (val) => {
                // Handle scrolling logic
                const htmlOverlay = getHTMLOverlay();
                // Access internal map key format from TextDisplay3D
                const overlayObj = htmlOverlay.objects.get(`textdisplay_${infoBoard.controlId}`);
                if (overlayObj && overlayObj.element) {
                    const el = overlayObj.element;
                    // Invert val because scrubber top(0) -> bottom(1), usually scrollTop 0 is top
                    // But LineCurve goes from Top Y to Bottom Y. 
                    // Scrubber 0 is start (Top), 1 is end (Bottom).
                    // scrollTop 0 is top. So map 0->0, 1->maxScroll.
                    el.scrollTop = val * (el.scrollHeight - el.clientHeight);
                }
            }
        });
        scrollbar.group.rotation.y = -Math.PI / 4; // Match infoBoard angle
        scrollbar.group.scale.set(1, 1, 1); // Initially visible
        env.add(scrollbar.group);
        env.updatables.push(scrollbar);


        // 3. Main Center Card (Directly below kinetic core)
        const centerCard = new MagneticCard3D(env.scene, env.camera, [0, 0.45, -0.7], {
            width: 1.0,
            height: 0.4,
            content: "MAIN_ACTION",
            color: 0x222222,
            renderer: env.renderer
        });
        centerCard.group.rotation.x = -Math.PI / 4; // Steeper angle
        env.add(centerCard.group);
        env.updatables.push(centerCard);

        // "Export" Button on Center Card
        const exportBtn = new Button3D(env.scene, env.camera, [0, 0.45, -0.68], {
            label: "EXPORT PROJECT", // Changed text to label for Button3D
            color: 0xff4444,
            width: 0.8,
            height: 0.15,
            padding: 0.05,
            onClick: () => {
                exportModal.open();
            }
        });
        exportBtn.group.rotation.x = -Math.PI / 4;
        env.add(exportBtn.group);
        env.updatables.push(exportBtn);


        // C. DIALOG (Hidden initially)
        // Moved Z closer to camera (from -1.0 to -0.5) to prevent z-fighting with background elements
        // C. DIALOG (Hidden initially)
        // Moved Z closer to camera (from -1.0 to -0.5) to prevent z-fighting with background elements
        const exportModal = new Modal3D(env.scene, env.camera, [0, 1.6, -0.5], {
            title: "TRANSMISSION PROTOCOL",
            width: 7.0, // Massive width
            height: 5.0, // Massive height
            isOpen: false,
            content: "Select transmission format.",
            htmlContent: `
                <div style="text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center;"> 
                    <!-- Centering container -->
                    
                    <div style="font-size: 4em; margin-bottom: 10px; text-shadow: 0 0 20px #4ecdc4;">📦</div>
                    
                    <h2 style="margin: 0 0 20px 0; color: #4ecdc4; border: none; padding: 0;">ARTIFACT READY</h2>
                    
                    <p style="color: #aaa; margin: 0 0 30px 0; font-size: 1.1em;">
                        Preparing to transmit <strong>Curator Workspace</strong> data to local storage.
                    </p>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; background: rgba(78, 205, 196, 0.1); padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid rgba(78, 205, 196, 0.2);">
                        <div>
                            <strong style="color: #fff;">📦 Payload:</strong> <span style="color: #4ecdc4;">14 Modules</span><br>
                            <strong style="color: #fff;">🎨 Textures:</strong> <span style="color: #4ecdc4;">4K Neural</span>
                        </div>
                        <div>
                            <strong style="color: #fff;">💾 Size:</strong> <span style="color: #ff6b6b;">45 MB</span><br>
                            <strong style="color: #fff;">🔐 Encryption:</strong> <span style="color: #4ecdc4;">Quantum</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px; justify-content: center;">
                        <button onclick="startExport(this, '.GLB')" style="padding: 15px 30px; background: #4ecdc4; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #050510; font-size: 1em; text-transform: uppercase; letter-spacing: 1px; min-width: 200px;">
                            Initialize .GLB
                        </button>
                        <button onclick="startExport(this, '.USDZ')" style="padding: 15px 30px; background: rgba(255, 107, 107, 0.2); border: 1px solid #ff6b6b; border-radius: 6px; font-weight: bold; cursor: pointer; color: #ff6b6b; font-size: 1em; text-transform: uppercase; letter-spacing: 1px; min-width: 200px;">
                            Archive .USDZ
                        </button>
                    </div>
                </div>
            `
        });
        env.add(exportModal.group);
        env.updatables.push(exportModal);

        // D. INTERACTION LOGIC (Raycasting for Toggles)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, env.camera);

            // Check Left Card
            const leftIntersects = raycaster.intersectObjects([leftCard.group], true);
            if (leftIntersects.length > 0) {
                appState.showTools = !appState.showTools;
                animateToggle(accordion.group, appState.showTools);
                // Visual feedback on card
                if (leftCard.cardMesh) leftCard.cardMesh.material.emissive.setHex(appState.showTools ? 0x4ecdc4 : 0x000000);
            }

            // Check Right Card
            const rightIntersects = raycaster.intersectObjects([rightCard.group], true);
            if (rightIntersects.length > 0) {
                appState.showInfo = !appState.showInfo;
                animateToggle(infoBoard.group, appState.showInfo);
                animateToggle(scrollbar.group, appState.showInfo);
                if (rightCard.cardMesh) rightCard.cardMesh.material.emissive.setHex(appState.showInfo ? 0x4ecdc4 : 0x000000);
            }
        });

        // Simple scale animation helper
        function animateToggle(group, show) {
            const target = show ? 1 : 0;
            const start = group.scale.x;
            const startTime = Date.now();
            const duration = 300;

            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic
                const ease = 1 - Math.pow(1 - progress, 3);

                const val = start + (target - start) * ease;
                group.scale.setScalar(val);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            update();
        }

        // Global export handler
        window.startExport = (btn, format) => {
            if (btn.classList.contains('processing')) return;

            const originalText = btn.innerText;
            btn.classList.add('processing');
            btn.innerHTML = `<div class="spinner"></div> PROCESSING ${format}...`;

            setTimeout(() => {
                btn.innerHTML = `✅ TRANSMISSION COMPLETE`;
                btn.style.background = '#4ecdc4';
                btn.style.color = '#000';
                btn.style.borderColor = '#4ecdc4';

                setTimeout(() => {
                    // Reset after another delay if needed, or leave as done
                    // btn.innerHTML = originalText;
                    // btn.classList.remove('processing');
                }, 3000);
            }, 2000);
        };

        // 3. Start Loop
        env.start();
    </script>
</body>

</html>
