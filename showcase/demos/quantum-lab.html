<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Processor: Q-Aurora Core</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000510;
            font-family: 'Courier New', monospace;
        }

        #quantum-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #00ccff;
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Sub-zero vignette */
        #cryo-wash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0, 10, 30, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="cryo-wash"></div>
    <div id="quantum-hud">
        <h1>Q-AURORA PROCESSOR</h1>
        <div class="sub">Temp: 15mK • Coherence: Stable</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { DataVolume3D } from '../../src/controls/DataVolume3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x000510);
        env.scene.fog = new THREE.Fog(0x000510, 5, 20);

        // Cryogenic Lighting
        const amb = new THREE.AmbientLight(0x00ccff, 0.4);
        env.scene.add(amb);

        const point = new THREE.PointLight(0xaa00ff, 2, 10);
        point.position.set(0, 4, -2);
        env.scene.add(point);

        // 2. Quantum AI (Ghost)
        const qLink = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(qLink);
        env.updatables.push(qLink);

        setTimeout(() => {
            qLink.updatePanelText("QUANTUM_ENTANGLEMENT_ESTABLISHED");
            qLink.guideTo(volume.group, "The Qubit Superposition Volume");
        }, 1500);


        // 3. QUANTUM TOOLS

        // Qubit Cloud (Data Volume)
        const volume = new DataVolume3D(env.scene, env.camera, [0, 1.8, -2], {
            width: 3, height: 3, depth: 3, pointCount: 1024, pointSize: 0.05,
            color: 0x00ccff
        });
        env.add(volume.group);
        env.updatables.push(volume);

        // Probability Chart
        const probChart = new Chart3D(env.scene, env.camera, [4, 2.0, -3], {
            width: 3, height: 2, chartType: 'line',
            data: {
                labels: ['ψ1', 'ψ2', 'ψ3', 'ψ4', 'ψ5'],
                datasets: [{
                    label: 'Amplitude',
                    data: [80, 20, 45, 10, 95],
                    borderColor: '#aa00ff',
                    backgroundColor: 'rgba(170, 0, 255, 0.1)'
                }]
            }
        });
        probChart.group.rotation.y = -0.4;
        env.add(probChart.group);
        env.updatables.push(probChart);

        // Lab Log
        const log = new MagneticCard3D(env.scene, env.camera, [-4, 2.0, -3], {
            width: 2.2, height: 2.5, color: 0x0a1a3a,
            title: "EXP_LOG_77", description: "Hadamard gates applied.\nBell state confirmed.\nDecoding protein folding..."
        });
        log.group.rotation.y = 0.4;
        env.add(log.group);
        env.updatables.push(log);


        // 4. INTERACTIVES

        const runBtn = new Button3D(env.scene, env.camera, [0, 0.2, -1], {
            label: "RUN_GROVER", width: 2.2, color: 0x00ff00,
            onClick: () => {
                qLink.updatePanelText("ITERATING_QUANTUM_SEARCH...");
                volume.group.scale.set(1.5, 1.5, 1.5);
                setTimeout(() => volume.group.scale.set(1, 1, 1), 500);
            }
        });
        env.add(runBtn.group);
        env.updatables.push(runBtn);


        // 5. START
        env.start();

    </script>
</body>

</html>
