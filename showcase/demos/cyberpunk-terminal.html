<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Protocol: Cybernetic Terminal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Courier New', monospace;
        }

        #deck-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 4px;
        }

        .sub {
            font-size: 0.8rem;
            color: #ff00ff;
            opacity: 0.8;
        }

        /* Glitch scanlines */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="scanlines"></div>
    <div id="deck-hud">
        <h1>GHOST_PROTOCOL_V4</h1>
        <div class="sub">ICE Level: Critical • Trace: 0%</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';
        import { HaloCard3D } from '../../src/controls/HaloCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.6, 4] });
        env.init();
        env.scene.background = new THREE.Color(0x050505);

        // Neon Matrix Ambience
        const grid = new THREE.GridHelper(20, 20, 0xff00ff, 0x00ff88);
        grid.position.y = -2;
        env.scene.add(grid);

        // 2. Hacker AI (Ghost)
        const deckAI = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(deckAI);
        env.updatables.push(deckAI);

        setTimeout(() => {
            deckAI.updatePanelText("DECK_LINK_ESTABLISHED: WELCOME GHOST");
            deckAI.guideTo(mainLog.group, "Accessing Mission Log");
        }, 1500);


        // 3. NET DECK TOOLS

        // Main Hacking Log
        const mainLog = new MagneticCard3D(env.scene, env.camera, [0, 1.2, -2], {
            width: 3.5, height: 2, color: 0x0a0a0a,
            title: "SYS_LOG", description: "> Scanning firewall...\n> Exploit detected in sector 4\n> Bypassing ICE..."
        });
        env.add(mainLog.group);
        env.updatables.push(mainLog);

        // Traffic Monitor
        const traffic = new Chart3D(env.scene, env.camera, [-3.5, 2.0, -2.5], {
            width: 3, height: 2, chartType: 'line',
            data: {
                labels: ['T1', 'T2', 'T3', 'T4', 'T5'],
                datasets: [{
                    label: 'Bandwidth',
                    data: [40, 60, 45, 80, 70],
                    borderColor: '#00ff88',
                    backgroundColor: 'rgba(0, 255, 136, 0.1)'
                }]
            }
        });
        traffic.group.rotation.y = 0.4;
        env.add(traffic.group);
        env.updatables.push(traffic);

        // Hacking Actions
        const breachBtn = new Button3D(env.scene, env.camera, [-3.5, 0.8, -2.5], {
            label: "BREACH_ICE", width: 2.5, color: 0xff00ff,
            onClick: () => {
                deckAI.updatePanelText("WARNING: BLACK_ICE_ACTIVE");
                grid.material.color.setHex(0xff0000);
                setTimeout(() => grid.material.color.setHex(0xff00ff), 1000);
            }
        });
        breachBtn.group.rotation.y = 0.4;
        env.add(breachBtn.group);
        env.updatables.push(breachBtn);


        // 4. DATA NODES (Specimens)
        const node1 = new VolumetricCard3D(env.scene, env.camera, [3.5, 1.5, -2.5], {
            width: 2, height: 3, baseColor: 0x00ff88, title: "DATA_CORE_01", popScale: 0.5
        });
        node1.group.rotation.y = -0.4;
        env.add(node1.group);
        env.updatables.push(node1);

        const nodeInfo = new HaloCard3D(env.scene, env.camera, [0, 0, 0], {
            title: "ENCRYPTION: AES-2048", width: 1.5, height: 0.4,
            offset: [0, 1.2, 0], anchorObject: node1.group, color: 0x00ff88
        });
        env.add(nodeInfo.group);
        env.updatables.push(nodeInfo);


        // 5. START
        env.start();

    </script>
</body>

</html>
