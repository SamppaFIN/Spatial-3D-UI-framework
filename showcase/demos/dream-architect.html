<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Architect: Neural Weaving</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0f0520;
            font-family: 'Georgia', serif;
        }

        #dream-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #d4a5ff;
            text-shadow: 0 0 10px rgba(212, 165, 255, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
        }

        .sub {
            font-size: 0.8rem;
            font-style: italic;
            opacity: 0.8;
        }

        /* REM vignette */
        #rem-wash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(15, 5, 32, 0.6) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="rem-wash"></div>
    <div id="dream-hud">
        <h1>DREAM_ARCHITECT</h1>
        <div class="sub">Lucidity: 92% • Depth: Level 3</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { KineticSculpture3D } from '../../src/controls/KineticSculpture3D.js';
        import { AIPortal3D } from '../../src/controls/AIPortal3D.js';
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Slider3D } from '../../src/controls/Slider3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0x0f0520);
        env.scene.fog = new THREE.FogExp2(0x0f0520, 0.04);

        // Surreal Ambient Lighting
        const amb = new THREE.AmbientLight(0xd4a5ff, 0.4);
        env.scene.add(amb);

        const spark = new THREE.PointLight(0xffd700, 1.5, 10);
        spark.position.set(2, 4, 1);
        env.scene.add(spark);

        // 2. Dreamweaver AI (Ghost)
        const weaver = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(weaver);
        env.updatables.push(weaver);

        setTimeout(() => {
            weaver.updatePanelText("WEAVING_NEURAL_LATENT_SCENES");
            weaver.guideTo(sculpture.group, "The Core Sculpt: Memory Echo");
        }, 1500);


        // 3. ARCHITECT TOOLS

        // Kinetic Centerpiece
        const sculpture = new KineticSculpture3D(env.scene, env.camera, [0, 1.8, -2], {
            nodeCount: 12, complexity: 0.8, color: 0xffd700
        });
        env.add(sculpture.group);
        env.updatables.push(sculpture);

        // Dream Portals
        const p1 = new AIPortal3D(env.scene, env.camera, [-3.5, 1.8, -3], {
            width: 2.2, height: 3.5, label: "GARDEN_REM", theme: 'cosmic'
        });
        env.add(p1.group);
        env.updatables.push(p1);

        const p2 = new AIPortal3D(env.scene, env.camera, [3.5, 1.8, -3], {
            width: 2.2, height: 3.5, label: "VOID_MEMORY", theme: 'void'
        });
        env.add(p2.group);
        env.updatables.push(p2);


        // 4. EDITOR CONTROLS

        const journal = new MagneticCard3D(env.scene, env.camera, [0, 0.5, -1], {
            width: 2.2, height: 1.5, color: 0x1a0a3a,
            title: "DREAM_LOG", description: "Escher-staircase woven.\nGravity: 0.1g\nTime: Syrupy."
        });
        env.add(journal.group);
        env.updatables.push(journal);

        const slider = new Slider3D(env.scene, env.camera, [0, -0.6, -1], {
            label: "LUCIDITY_DEPTH", width: 2, color: 0x00ffff,
            onChange: (c, v) => {
                sculpture.complexity = v;
                env.scene.fog.density = 0.01 + (v * 0.1);
            }
        });
        env.add(slider.group);
        env.updatables.push(slider);


        // 5. START
        env.start();

    </script>
</body>

</html>
