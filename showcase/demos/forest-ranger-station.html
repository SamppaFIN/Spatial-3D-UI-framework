<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Station Alpha: Nature Hub</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e8f5e9;
            font-family: 'Inter', sans-serif;
        }

        #ranger-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #2e7d32;
            text-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .sub {
            font-size: 0.8rem;
            color: #4caf50;
        }

        /* Forest canopy vignette */
        #canopy {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(46, 125, 50, 0.2) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="canopy"></div>
    <div id="ranger-hud">
        <h1>RANGER STATION ALPHA</h1>
        <div class="sub">Redwood Sector 7 • Fire Risk: LOW</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SpatialEnvironment } from '../../src/environments/SpatialEnvironment.js';
        import { SemanticGhost } from '../../src/ai/SemanticGhost.js';

        // Components
        import { MagneticCard3D } from '../../src/controls/MagneticCard3D.js';
        import { Chart3D } from '../../src/controls/Chart3D.js';
        import { Toggle3D } from '../../src/controls/Toggle3D.js';
        import { VolumetricCard3D } from '../../src/controls/VolumetricCard3D.js';

        // 1. Setup
        const env = new SpatialEnvironment(document.body, { cameraPos: [0, 1.8, 5] });
        env.init();
        env.scene.background = new THREE.Color(0xdcedc8);
        env.scene.fog = new THREE.Fog(0xdcedc8, 5, 25);

        // Natural Sun Lighting
        const amb = new THREE.AmbientLight(0xffffff, 0.6);
        env.scene.add(amb);

        const sun = new THREE.DirectionalLight(0xfffde7, 1);
        sun.position.set(5, 10, 5);
        env.scene.add(sun);

        // 3D Leaf Particles
        const leafGeo = new THREE.BufferGeometry();
        const leafCount = 100;
        const leafPos = new Float32Array(leafCount * 3);
        for (let i = 0; i < leafCount; i++) {
            leafPos[i * 3] = (Math.random() - 0.5) * 20;
            leafPos[i * 3 + 1] = Math.random() * 10;
            leafPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
        }
        leafGeo.setAttribute('position', new THREE.BufferAttribute(leafPos, 3));
        const leafMat = new THREE.PointsMaterial({ size: 0.15, color: 0x4caf50, transparent: true, opacity: 0.6 });
        const leaves = new THREE.Points(leafGeo, leafMat);
        env.scene.add(leaves);

        env.updatables.push({
            update: (d) => {
                const pos = leafGeo.attributes.position.array;
                for (let i = 0; i < leafCount; i++) {
                    pos[i * 3 + 1] -= 0.02;
                    pos[i * 3] += Math.sin(Date.now() * 0.001 + i) * 0.01;
                    if (pos[i * 3 + 1] < -2) pos[i * 3 + 1] = 8;
                }
                leafGeo.attributes.position.needsUpdate = true;
            }
        });


        // 2. Ranger AI (Ghost)
        const guardian = new SemanticGhost(env.camera, env.scene, env.renderer);
        env.add(guardian);
        env.updatables.push(guardian);

        setTimeout(() => {
            guardian.updatePanelText("MONITORING FOREST INTEGRITY");
            guardian.guideTo(wildlifeLog.group, "New Wildlife Sightings");
        }, 1500);


        // 3. RANGER TOOLS

        // Wildlife Log
        const wildlifeLog = new MagneticCard3D(env.scene, env.camera, [-3, 1.5, -3], {
            width: 2.2, height: 3, color: 0xffffff,
            title: "WILDLIFE LOG", description: "Bears: 1 (Trail 7)\nDeer: 8 (Meadow 3)\nPack: Grey Wolf tracked."
        });
        wildlifeLog.group.rotation.y = 0.4;
        env.add(wildlifeLog.group);
        env.updatables.push(wildlifeLog);

        // Weather Chart
        const weather = new Chart3D(env.scene, env.camera, [3, 2, -3], {
            width: 3, height: 2, chartType: 'line',
            data: {
                labels: ['8AM', '10AM', '12PM', '2PM', '4PM'],
                datasets: [{
                    label: 'Humidity %',
                    data: [65, 62, 58, 60, 63],
                    borderColor: '#2196f3',
                    backgroundColor: 'rgba(33, 150, 243, 0.1)'
                }]
            }
        });
        weather.group.rotation.y = -0.4;
        env.add(weather.group);
        env.updatables.push(weather);

        // Sensor Toggle
        const sensorToggle = new Toggle3D(env.scene, env.camera, [3, 0.8, -3], {
            label: "FIRE SENSORS", width: 2.5, isOn: true, onColor: 0xff9800
        });
        sensorToggle.group.rotation.y = -0.4;
        env.add(sensorToggle.group);
        env.updatables.push(sensorToggle);


        // 4. SPECIMEN SCANNER
        const specimen = new VolumetricCard3D(env.scene, env.camera, [0, 0.5, -1.5], {
            width: 1.5, height: 1.5, baseColor: 0x8bc34a, title: "FLORA_SCAN", popHeight: 0.8
        });
        env.add(specimen.group);
        env.updatables.push(specimen);


        // 5. START
        env.start();

    </script>
</body>

</html>
