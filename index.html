<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸♾️ 3D Spatial UI Component Library</title>
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        /* Tooltip and Label Styles */
        .spatial-tooltip {
            background: linear-gradient(145deg, rgba(20, 20, 40, 0.95), rgba(10, 10, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            max-width: 250px;
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.5),
                0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            pointer-events: none;
            user-select: none;
            white-space: normal;
            word-wrap: break-word;
        }
        
        .spatial-tooltip strong {
            color: #ffffff;
            font-weight: 600;
        }
        
        .spatial-tooltip em {
            color: #e0e0e0;
            font-style: italic;
        }
        
        .spatial-tooltip code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ffd700;
        }
        
        .spatial-tooltip a {
            color: #6bb6ff;
            text-decoration: underline;
        }
        
        .spatial-tooltip a:hover {
            color: #8cc8ff;
        }
        
        .spatial-label {
            background: linear-gradient(145deg, rgba(30, 30, 50, 0.9), rgba(20, 20, 40, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 12px;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 
                0 0 15px rgba(0, 0, 0, 0.4),
                0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }
        
        .spatial-label strong {
            color: #ffffff;
            font-weight: 600;
        }
        
        .spatial-label em {
            color: #e0e0e0;
            font-style: italic;
        }
        
        .spatial-label code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #ffd700;
        }
        
        .spatial-label .icon,
        .spatial-tooltip .icon {
            display: inline-block;
            margin: 0 2px;
            font-size: 1.1em;
            vertical-align: middle;
        }
        
        /* Text Display Styles */
        .spatial-text-display {
            background: linear-gradient(145deg, rgba(20, 20, 40, 0.95), rgba(10, 10, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .spatial-text-display h1,
        .spatial-text-display h2,
        .spatial-text-display h3 {
            color: #ffffff;
            margin-top: 0.5em;
            margin-bottom: 0.3em;
        }
        
        .spatial-text-display p {
            margin: 0.5em 0;
        }
        
        .spatial-text-display code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ffd700;
        }
        
        /* Text Input Styles */
        .spatial-text-input {
            background: rgba(20, 20, 40, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }
        
        .spatial-text-input:focus {
            border-color: #6bb6ff;
            box-shadow: 0 0 10px rgba(107, 182, 255, 0.5);
        }
        
        .spatial-text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        /* Chart Styles */
        .spatial-chart {
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        /* Ensure HTML overlay elements don't interfere with 3D interactions */
        .html-overlay {
            pointer-events: none;
        }
        
        /* Allow pointer events for interactive elements */
        .spatial-text-input {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Canvas for WebGL rendering -->
    <canvas id="canvas"></canvas>
    
    <!-- Background Switcher UI -->
    <div id="background-switcher" class="background-switcher">
        <button class="room-btn" data-room="coordinate" title="Coordinate Room">
            📐 Coordinate
        </button>
        <button class="room-btn" data-room="landscape" title="Landscape Room">
            🏔️ Landscape
        </button>
        <button class="room-btn" data-room="space" title="Space Room">
            🌌 Space
        </button>
    </div>
    
    <!-- FPS Counter -->
    <div id="fps-counter" class="fps-counter">FPS: --</div>
    
    <!-- Import Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Main application -->
    <script type="module" src="/src/main.js?v=4.1"></script>
</body>
</html>
