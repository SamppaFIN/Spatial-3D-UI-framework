<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Features Demo - Spatial UI 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.2rem;
            background: linear-gradient(to right, #4ecdc4, #6bb6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            margin-left: auto;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: white;
        }

        .controls-overlay {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.8);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 2rem;
        }

        .control-item h4 {
            margin: 0 0 0.5rem 0;
            color: #4ecdc4;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .control-item p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>Spatial Buttons Showcase</h1>
        <a href="../index.html" class="back-link">← Back to Home</a>
    </nav>

    <div id="canvas-container"></div>

    <div class="controls-overlay">
        <div class="control-item">
            <h4>Left: Pill Shape</h4>
            <p>Ripple Effect • Green Theme</p>
        </div>
        <div class="control-item">
            <h4>Center: Sacred Geometry</h4>
            <p>Pulse Animation • Locked State Toggle</p>
        </div>
        <div class="control-item">
            <h4>Right: Action Sphere</h4>
            <p>Loading State • Fast Animation</p>
        </div>
        <form class="control-item" style="border-left: 1px solid rgba(78, 205, 196, 0.3); padding-left: 1rem;"
            onsubmit="return false;">
            <h4>AI Integration</h4>
            <input type="password" id="api-key" placeholder="OpenAI API Key"
                style="background: rgba(0,0,0,0.5); border: 1px solid #4ecdc4; color: white; padding: 4px; border-radius: 4px; width: 100px;"
                autocomplete="current-password">
            <p style="font-size: 0.8rem; margin-top: 4px;">Click Diamond to Gen Label</p>
        </form>
    </div>

    <script
        type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
    <script type="module">
        import * as THREE from 'three';
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { Button3D } from '../../src/controls/Button3D.js';
        import { ControlRegistry } from '../../src/core/ControlRegistry.js';

        // Setup Scene
        const container = document.getElementById('canvas-container');
        const scene3D = new Scene3D(container);
        const scene = scene3D.getScene();
        const camera = scene3D.getCamera();
        const renderer = scene3D.getRenderer();

        camera.position.set(0, 1, 8); // Moved back slightly to fit more
        scene.background = new THREE.Color(0x0a0a0f);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // 1. Pill Button (Left)
        const btn1 = new Button3D(scene, camera, [-4, 0, 0], {
            label: "Submit",
            width: 2.0, height: 0.8, depth: 0.2,
            geometryType: 'pill',
            color: 0x48bb78,
            rippleEffect: true,
            onClick: () => console.log('Pill Clicked')
        });
        ControlRegistry.register(btn1);

        // 2. Sacred Geometry Button (Center-Left) - Locked
        const btn2 = new Button3D(scene, camera, [-1.5, 0, 0], {
            label: "🔒 Locked",
            width: 1.2, height: 1.2, depth: 0.2,
            geometryType: 'octahedron', // closest to sacred/octahedron
            color: 0xff6b9d,
            pulseAnimation: true,
            onClick: () => console.log('Locked button clicked')
        });
        // Imitate 'locked' visual state manually or via property if supported
        // Button3D doesn't strictly have a 'locked' bool that prevents click logic internally unless we block it
        // But for visual demo, text is enough.
        ControlRegistry.register(btn2);

        // 3. Sphere Action Button (Center-Right)
        const btn3 = new Button3D(scene, camera, [1.5, 0, 0], {
            label: "Loading...",
            width: 1.2, height: 1.2, depth: 0.2,
            geometryType: 'sphere',
            sphereSegments: 48,
            color: 0x6bb6ff,
            loading: true,
            onClick: () => console.log('Action Clicked')
        });
        ControlRegistry.register(btn3);

        // 4. AI Diamond Button (Right)
        const btn4 = new Button3D(scene, camera, [4, 0, 0], {
            label: "AI Label 🤖",
            width: 1.2, height: 1.2, depth: 0.5,
            geometryType: 'diamond',
            color: 0x9b59b6, // Purple
            rippleEffect: true,
            onClick: () => generateAILabel()
        });
        ControlRegistry.register(btn4);

        // OpenAI Integration Logic
        async function generateAILabel() {
            const apiKey = document.getElementById('api-key').value;
            if (!apiKey) {
                alert('Please enter an OpenAI API Key first');
                return;
            }

            // Update label via property
            btn4.label = "Generating...";
            btn4.createMeshLabel(); // Force update (hacky, ideally property setter handles this)

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{
                            role: "user",
                            content: "Generate a single short, creative word for a futuristic button label (max 10 chars). Return ONLY the word."
                        }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const newLabel = data.choices[0].message.content.trim();
                    btn4.label = newLabel + " ✨";
                    btn4.createMeshLabel();
                } else {
                    btn4.label = "Error ❌";
                    btn4.createMeshLabel();
                }
            } catch (error) {
                console.error('AI Error:', error);
                btn4.label = "Failed ⚠️";
                btn4.createMeshLabel();
            }
        }

        // Standard Interaction Handling
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // Avoid triggering if clicking UI
            if (event.target.tagName === 'INPUT' || event.target.closest('.controls-overlay')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Intersect all objects in the scene
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0];
                let object = hit.object;

                // Traverse up to find the control holder
                while (object) {
                    if (object.userData && object.userData.control) {
                        const control = object.userData.control;
                        if (control.onClick) {
                            control.onClick();
                        }
                        break;
                    }
                    object = object.parent;
                }
            }
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Update all controls via registry or manually
            ControlRegistry.getAll().forEach(ctrl => ctrl.update());

            scene3D.render();
        }

        animate();
    </script>
</body>

</html>
