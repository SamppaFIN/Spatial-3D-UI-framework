<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Features Demo - Spatial UI 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/showcase.css">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0f;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid rgba(78, 205, 196, 0.3);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            z-index: 100;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.2rem;
            background: linear-gradient(to right, #4ecdc4, #6bb6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            margin-left: auto;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: white;
        }

        .button-label-2d {
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .controls-overlay {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 30, 0.8);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 2rem;
        }

        .control-item h4 {
            margin: 0 0 0.5rem 0;
            color: #4ecdc4;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .control-item p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>Spatial Buttons Showcase</h1>
        <a href="../index.html" class="back-link">← Back to Home</a>
    </nav>

    <div id="canvas-container"></div>

    <div class="controls-overlay">
        <div class="control-item">
            <h4>Left: Pill Shape</h4>
            <p>Ripple Effect • Green Theme</p>
        </div>
        <div class="control-item">
            <h4>Center: Sacred Geometry</h4>
            <p>Pulse Animation • Locked State Toggle</p>
        </div>
        <div class="control-item">
            <h4>Right: Action Sphere</h4>
            <p>Loading State • Fast Animation</p>
        </div>
        <form class="control-item" style="border-left: 1px solid rgba(78, 205, 196, 0.3); padding-left: 1rem;"
            onsubmit="return false;">
            <h4>AI Integration</h4>
            <input type="password" id="api-key" placeholder="OpenAI API Key"
                style="background: rgba(0,0,0,0.5); border: 1px solid #4ecdc4; color: white; padding: 4px; border-radius: 4px; width: 100px;"
                autocomplete="current-password">
            <p style="font-size: 0.8rem; margin-top: 4px;">Click Diamond to Gen Label</p>
        </form>
    </div>

    <script
        type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
    <script type="module">
        import * as THREE from 'three';
        import { Scene3D } from '../../src/core/Scene3D.js';
        import { ButtonFactory } from '../../src/utils/ButtonFactory.js';

        // Setup Scene
        const container = document.getElementById('canvas-container');
        const scene3D = new Scene3D(container);
        const scene = scene3D.getScene();
        const camera = scene3D.getCamera();
        const renderer = scene3D.getRenderer();

        camera.position.set(0, 1, 8); // Moved back slightly to fit more
        scene.background = new THREE.Color(0x0a0a0f);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        // Buttons container
        const buttons = [];
        const labels = [];

        // 1. Pill Button (Left)
        const btn1Config = {
            width: 2.0, height: 0.8, depth: 0.2,
            color: 0x48bb78,
            rippleEffect: true,
            onClick: () => console.log('Pill Clicked')
        };
        const btn1Geo = ButtonFactory.createGeometry('pill', btn1Config.width, btn1Config.height, btn1Config.depth);
        const btn1Mat = ButtonFactory.createMaterial(btn1Config.color);
        const btn1Mesh = new THREE.Mesh(btn1Geo, btn1Mat);
        btn1Mesh.position.set(-4, 0, 0);
        scene.add(btn1Mesh);

        const btn1Control = ButtonFactory.enhanceButton(btn1Mesh, btn1Config, scene);
        buttons.push(btn1Control);

        // Label for Button 1
        createLabel("Submit", -4, 0);

        // 2. Sacred Geometry Button (Center-Left) - Locked
        const btn2Config = {
            width: 1.2, height: 1.2, depth: 0.2,
            color: 0xff6b9d,
            pulseAnimation: true,
            locked: true,
            onClick: () => console.log('Locked button clicked')
        };
        const btn2Geo = ButtonFactory.createGeometry('octahedron', btn2Config.width, btn2Config.height, btn2Config.depth);
        const btn2Mat = ButtonFactory.createMaterial(btn2Config.color);
        const btn2Mesh = new THREE.Mesh(btn2Geo, btn2Mat);
        btn2Mesh.position.set(-1.5, 0, 0);
        scene.add(btn2Mesh);

        const btn2Control = ButtonFactory.enhanceButton(btn2Mesh, btn2Config, scene);
        buttons.push(btn2Control);

        // Label for Button 2
        createLabel("🔒 Locked", -1.5, 0);

        // Toggle lock on click (wrapper logic)
        // We'll add a helper click zone since the button itself is locked
        const unlockZone = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        unlockZone.position.z = 0.5;
        // scene.add(unlockZone); // Simplified demo for now

        // 3. Sphere Action Button (Center-Right)
        const btn3Config = {
            width: 1.2, height: 1.2, depth: 0.2, sphereSegments: 48,
            color: 0x6bb6ff,
            loading: true,
            onClick: () => console.log('Action Clicked')
        };
        const btn3Geo = ButtonFactory.createGeometry('sphere', btn3Config.width, btn3Config.height, btn3Config.depth, btn3Config);
        const btn3Mat = ButtonFactory.createMaterial(btn3Config.color);
        const btn3Mesh = new THREE.Mesh(btn3Geo, btn3Mat);
        btn3Mesh.position.set(1.5, 0, 0);
        scene.add(btn3Mesh);

        const btn3Control = ButtonFactory.enhanceButton(btn3Mesh, btn3Config, scene);
        buttons.push(btn3Control);

        // Label for Button 3
        createLabel("Loading...", 1.5, 0);

        // 4. AI Diamond Button (Right)
        const btn4Config = {
            width: 1.2, height: 1.2, depth: 0.5,
            color: 0x9b59b6, // Purple
            rippleEffect: true,
            onClick: () => generateAILabel()
        };
        const btn4Geo = ButtonFactory.createGeometry('diamond', btn4Config.width, btn4Config.height, btn4Config.depth);
        const btn4Mat = ButtonFactory.createMaterial(btn4Config.color);
        const btn4Mesh = new THREE.Mesh(btn4Geo, btn4Mat);
        btn4Mesh.position.set(4, 0, 0);
        scene.add(btn4Mesh);
        const btn4Control = ButtonFactory.enhanceButton(btn4Mesh, btn4Config, scene);
        buttons.push(btn4Control);
        const aiLabel = createLabel("AI Label 🤖", 4, 0);

        // Helper to create 2D labels
        function createLabel(text, x, y) {
            const div = document.createElement('div');
            div.className = 'button-label-2d';
            div.textContent = text;
            container.appendChild(div);
            labels.push({ element: div, position: new THREE.Vector3(x, y, 0), originalText: text });
            return div;
        }

        // OpenAI Integration Logic
        async function generateAILabel() {
            const apiKey = document.getElementById('api-key').value;
            if (!apiKey) {
                alert('Please enter an OpenAI API Key first');
                return;
            }

            aiLabel.textContent = "Generating...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{
                            role: "user",
                            content: "Generate a single short, creative word for a futuristic button label (max 10 chars). Return ONLY the word."
                        }],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    const newLabel = data.choices[0].message.content.trim();
                    aiLabel.textContent = newLabel + " ✨";
                } else {
                    aiLabel.textContent = "Error ❌";
                }
            } catch (error) {
                console.error('AI Error:', error);
                aiLabel.textContent = "Failed ⚠️";
            }
        }

        // Raycaster for interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // Avoid triggering if clicking UI
            if (event.target.tagName === 'INPUT' || event.target.closest('.controls-overlay')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                // Find which button was clicked
                buttons.forEach(btn => {
                    if (btn.mesh === intersects[0].object || btn.mesh === intersects[0].object.parent) {
                        btn.onClick();
                    }
                });
            }
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Update buttons
            buttons.forEach(btn => btn.update());

            // Update labels
            labels.forEach(lbl => {
                const vector = lbl.position.clone();
                vector.project(camera);

                // Only update if visible
                if (vector.z < 1) {
                    const x = (vector.x * 0.5 + 0.5) * container.clientWidth;
                    const y = (vector.y * -0.5 + 0.5) * container.clientHeight;
                    lbl.element.style.left = x + 'px';
                    lbl.element.style.top = y + 'px';
                }
            });

            scene3D.render();
        }

        animate();
    </script>
</body>

</html>
