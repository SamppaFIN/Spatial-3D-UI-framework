<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spatial UI 3D - Neural Symphony</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            color: #0ff;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            margin: 0;
            font-size: 2em;
        }

        .instruction {
            margin-top: 10px;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #0ff;
            padding: 10px;
            max-width: 300px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .log {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div id="ui-overlay">
        <h1>NEURAL SYMPHONY 🎵</h1>
        <div class="instruction">
            > SYSTEM READY.<br>
            > Drag specific connections between nodes to conduct the data flow.<br>
            > Create the network.
        </div>
    </div>
    <div class="log" id="log">Waiting for input...</div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import Scene3D from './src/core/Scene3D.js';
        import { GestureLoom3D } from './src/controls/GestureLoom3D.js';

        // Scene Setup
        const scene3D = new Scene3D({
            container: document.body,
            enableOrbitControls: true
        });

        // Dark Void
        scene3D.scene.background = new THREE.Color(0x050510);
        scene3D.scene.fog = new THREE.FogExp2(0x050510, 0.03);

        // Lights
        const ambient = new THREE.AmbientLight(0x4040ff, 0.5);
        scene3D.scene.add(ambient);

        const pointLight = new THREE.PointLight(0x00ffff, 1, 20);
        pointLight.position.set(0, 5, 5);
        scene3D.scene.add(pointLight);

        // Gesture Loom
        const loom = new GestureLoom3D(scene3D.scene, scene3D.camera, [0, 0, 0], {
            nodeColor: 0x00ffff, // Cyan
            lineColor: 0xff00ff, // Magenta
            nodeSize: 0.15
        });
        scene3D.add(loom.group);

        // Create Nodes in a 3D Cloud
        for (let i = 0; i < 15; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 3 + Math.random() * 2;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            loom.addNode([x, y, z], { index: i });
        }

        // Event Listeners
        const logEl = document.getElementById('log');

        loom.on('drawStart', (data) => {
            logEl.innerText = `> Connecting from Node_${data.node.userData.index}...`;
        });

        loom.on('connectionCreated', (data) => {
            logEl.innerText = `> SYNAPSE ESTABLISHED: Node_${data.from.userData.index} <==> Node_${data.to.userData.index}`;

            // Visual feedback: Flash background slightly
            scene3D.scene.background.setHex(0x101020);
            setTimeout(() => scene3D.scene.background.setHex(0x050510), 100);

            // Play sound (conceptually)
            // playSynthTone(data.to.userData.index); 
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            loom.update();
            scene3D.render();
        }
        animate();

    </script>
</body>

</html>
